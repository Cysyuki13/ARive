<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Model Editor — Ruin City</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: #0a0d12; color: #dfe4ea;
            font-family: "Courier New", Courier, monospace;
            font-size: 12px;
        }

        #app { display: flex; height: 100vh; }

        #viewport {
            flex: 1; position: relative;
            background: #10141a; overflow: hidden;
        }
        #viewport canvas { display: block; }

        /* ---------- Viewport toolbar ---------- */
        #toolbar {
            position: absolute; top: 12px; left: 12px; right: 12px;
            display: flex; align-items: center; gap: 10px;
            padding: 8px 12px;
            background: rgba(10, 14, 20, 0.85);
            border: 2px solid #232b36;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            font-size: 11px; flex-wrap: wrap; z-index: 10;
        }
        #toolbar button {
            font-family: inherit; font-size: 11px; padding: 5px 12px;
            letter-spacing: 1px; color: #b8c8d8; background: #141c26;
            border: 1px solid #2a3a4a; cursor: pointer;
        }
        #toolbar button.active {
            background: #2a3a4a; color: #e8c86a; border-color: #e8c86a;
        }
        #toolbar button:hover { background: #1a2530; }
        #toolbar label {
            display: flex; align-items: center; gap: 6px;
            color: #8a96a4; letter-spacing: 0.5px;
        }
        #toolbar .spacer { flex: 1; }
        #toolbar input[type="range"] { width: 90px; }

        /* ---------- Side panel ---------- */
        #panel {
            width: 400px; background: #0e1116;
            border-left: 2px solid #232b36;
            display: flex; flex-direction: column; overflow: hidden;
        }
        #panel header {
            padding: 16px 18px 14px;
            border-bottom: 2px solid #232b36; background: #0a0d12;
        }
        #panel header h1 {
            font-size: 14px; letter-spacing: 4px; color: #e8c86a;
            text-shadow: 2px 2px 0 #05070a;
        }
        #panel header .sub {
            font-size: 10px; color: #5a6a7a; margin-top: 4px; letter-spacing: 1px;
        }
        #controls { flex: 1; overflow-y: auto; padding-bottom: 12px; }
        #controls::-webkit-scrollbar { width: 8px; }
        #controls::-webkit-scrollbar-thumb { background: #2a3a4a; }
        #controls::-webkit-scrollbar-track { background: #0a0d12; }

        details { border-bottom: 1px solid #1a2028; }
        details[open] summary { background: #121820; }
        summary {
            padding: 10px 18px; font-size: 10px; letter-spacing: 3px;
            color: #6ac8e8; cursor: pointer; list-style: none;
            user-select: none; border-left: 3px solid transparent;
            transition: border-color .1s, background .1s;
        }
        summary::-webkit-details-marker { display: none; }
        summary::before { content: "▸ "; color: #5a6a7a; }
        details[open] summary::before { content: "▾ "; color: #6ac8e8; }
        summary:hover { border-left-color: #6ac8e8; }

        .entry {
            display: grid;
            grid-template-columns: 100px 1fr 62px;
            gap: 8px; align-items: center; padding: 5px 18px;
        }
        .entry .lbl {
            font-size: 10px; color: #8a96a4; letter-spacing: 0.5px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .entry input[type="range"] {
            width: 100%; height: 3px; background: #1a2028;
            appearance: none; -webkit-appearance: none;
            outline: none; cursor: pointer;
        }
        .entry input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 12px; height: 12px;
            background: #6ac8e8; border: 1px solid #0a0d12; cursor: grab;
        }
        .entry input[type="range"]::-moz-range-thumb {
            width: 12px; height: 12px; background: #6ac8e8;
            border: 1px solid #0a0d12; cursor: grab;
        }
        .entry input[type="number"] {
            width: 100%; font-family: inherit; font-size: 10px;
            padding: 3px 4px; background: #141c26; border: 1px solid #2a3a4a;
            color: #dfe4ea; outline: none; text-align: right;
        }
        .entry input[type="number"]:focus { border-color: #6ac8e8; }
        .entry input[type="color"] {
            width: 40px; height: 20px; background: none;
            border: 1px solid #2a3a4a; padding: 0; cursor: pointer;
        }
        .entry select {
            font-family: inherit; font-size: 10px; padding: 4px 6px;
            background: #141c26; border: 1px solid #2a3a4a;
            color: #dfe4ea; outline: none; width: 100%; cursor: pointer;
            grid-column: 2 / 4;
        }
        .entry select:focus { border-color: #6ac8e8; }

        /* ---------- Parts editor (avatar accessories) ---------- */
        .part-card {
            margin: 6px 14px 10px; padding: 10px 10px 6px;
            background: #10141a; border: 1px solid #232b36;
            border-left: 3px solid #6ac8e8;
        }
        .part-head {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 8px;
        }
        .part-head b {
            font-size: 10px; letter-spacing: 2px; color: #6ac8e8;
        }
        .part-head button {
            font-family: inherit; font-size: 10px; padding: 2px 8px;
            background: #2a1418; color: #e08a8a; border: 1px solid #4a2a2a;
            cursor: pointer; letter-spacing: 1px;
        }
        .part-head button:hover { background: #4a2020; color: #ffc8c8; }
        .part-row {
            display: grid; grid-template-columns: 60px 1fr 46px;
            gap: 6px; align-items: center; padding: 3px 0;
        }
        .part-row .lbl { font-size: 9px; color: #7a8a9a; letter-spacing: 0.3px; }
        .part-row input[type="range"] {
            width: 100%; height: 3px; background: #1a2028;
            appearance: none; -webkit-appearance: none; outline: none;
            cursor: pointer;
        }
        .part-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 10px; height: 10px;
            background: #6ac8e8; border: 1px solid #0a0d12; cursor: grab;
        }
        .part-row input[type="number"] {
            width: 100%; font-family: inherit; font-size: 9px;
            padding: 2px 3px; background: #141c26; border: 1px solid #2a3a4a;
            color: #dfe4ea; outline: none; text-align: right;
        }
        .part-row select {
            grid-column: 2 / 4; font-family: inherit; font-size: 10px;
            padding: 3px 5px; background: #141c26;
            border: 1px solid #2a3a4a; color: #dfe4ea;
            outline: none; cursor: pointer;
        }
        .add-part-btn {
            display: block; width: calc(100% - 28px); margin: 4px 14px 12px;
            font-family: inherit; font-size: 11px; letter-spacing: 2px;
            padding: 8px; background: #142028; color: #6ac8e8;
            border: 1px dashed #2a5a6a; cursor: pointer;
        }
        .add-part-btn:hover { background: #1a2c38; color: #a8e8ff; }

        /* ---------- Import / Export section ---------- */
        .io-wrap { padding: 10px 18px 16px; }
        .io-help {
            font-size: 10px; line-height: 1.6; color: #7a8a9a;
            letter-spacing: 0.3px; margin-bottom: 10px;
            border-left: 2px solid #2a3a4a; padding-left: 10px;
        }
        .io-help b { color: #e8c86a; }
        .io-help code {
            color: #6ac8e8; font-family: inherit;
            background: #10141a; padding: 1px 4px;
        }
        .io-textarea {
            width: 100%; min-height: 140px; max-height: 260px;
            resize: vertical; font-family: inherit; font-size: 10px;
            line-height: 1.5; padding: 8px 10px;
            background: #0a0d12; border: 1px solid #2a3a4a;
            color: #dfe4ea; outline: none;
            white-space: pre; overflow: auto;
        }
        .io-textarea:focus { border-color: #6ac8e8; }
        .io-row { display: flex; gap: 8px; margin-top: 8px; }
        .io-row button {
            flex: 1; font-family: inherit; font-size: 11px;
            padding: 8px 10px; letter-spacing: 2px; cursor: pointer;
            border: 2px solid #2a3a4a; background: #141c26; color: #b8c8d8;
        }
        .io-row button.primary {
            background: #e8c86a; color: #0b0f14;
            border-color: #f6e2a6; font-weight: bold;
        }
        .io-row button.primary:hover { background: #f6dd8b; }
        .io-row button:hover:not(.primary) {
            background: #1a2530; color: #e8f2ff; border-color: #6ac8e8;
        }
        .io-row button:active { transform: translateY(1px); }
        .io-status {
            margin-top: 8px; font-size: 10px; letter-spacing: 1px;
            min-height: 14px; color: #6ac8e8;
        }
        .io-status.err { color: #e05a5a; }
        .io-status.ok { color: #7ad07a; }

        /* ---------- Footer ---------- */
        #panel footer {
            padding: 12px 18px; border-top: 2px solid #232b36;
            background: #0a0d12; display: flex; gap: 8px;
        }
        #panel footer button {
            font-family: inherit; font-size: 11px; padding: 9px 14px;
            letter-spacing: 2px; cursor: pointer;
            border: 2px solid #2a3a4a; background: #141c26; color: #b8c8d8;
        }
        #panel footer button.primary {
            flex: 1; background: #e8c86a; color: #0b0f14;
            border-color: #f6e2a6; font-weight: bold;
        }
        #panel footer button.primary:hover { background: #f6dd8b; }
        #panel footer button:hover:not(.primary) {
            background: #1a2530; color: #e8f2ff; border-color: #6ac8e8;
        }
        #panel footer button:active { transform: translateY(1px); }

        /* ---------- Toast ---------- */
        #toast {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%) translateY(60px);
            padding: 10px 20px; background: #e8c86a; color: #0b0f14;
            font-weight: bold; letter-spacing: 2px; font-size: 11px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: transform .25s cubic-bezier(.34, 1.56, .64, 1);
            pointer-events: none; z-index: 20;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }

        /* ---------- Help overlay ---------- */
        #helpOverlay {
            position: absolute; bottom: 12px; left: 12px;
            padding: 6px 10px; background: rgba(10, 14, 20, 0.75);
            border: 1px solid #232b36; font-size: 10px; color: #5a6a7a;
            letter-spacing: 0.5px; pointer-events: none;
        }
        #fpLockHint {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 14px 24px; background: rgba(10, 14, 20, 0.9);
            border: 2px solid #6ac8e8; font-size: 12px;
            letter-spacing: 2px; color: #6ac8e8;
            pointer-events: none; display: none;
            text-shadow: 0 0 12px rgba(106, 200, 232, 0.5);
        }

        /* ---------- Editor tabs ---------- */
        #tabs {
            display: flex; gap: 2px;
            border-bottom: 2px solid #232b36; background: #0a0d12;
        }
        #tabs button {
            flex: 1; font-family: inherit; font-size: 11px;
            letter-spacing: 3px; padding: 11px 0;
            color: #5a6a7a; background: transparent; border: none;
            border-bottom: 3px solid transparent; cursor: pointer;
            transition: color .12s, border-color .12s, background .12s;
        }
        #tabs button:hover { color: #8fa0b2; background: #10141a; }
        #tabs button.active {
            color: #e8c86a; border-bottom-color: #e8c86a; background: #0e1116;
        }
    </style>
</head>

<body>

    <div id="app">

        <div id="viewport">
            <div id="toolbar">
                <button id="viewFP" class="active">◉ FP VIEW</button>
                <button id="viewOrbit">⟳ ORBIT</button>
                <span class="spacer"></span>
                <label><input type="checkbox" id="walkChk"> WALK</label>
                <label><input type="checkbox" id="sprintChk"> SPRINT</label>
                <label>PHASE <input type="range" id="phaseSld" min="0" max="6.2832" step="0.01" value="0"></label>
                <label>SWAY Y <input type="range" id="swayYSld" min="-0.22" max="0.22" step="0.005" value="0"></label>
                <label>SWAY X <input type="range" id="swayXSld" min="-0.18" max="0.18" step="0.005" value="0"></label>
            </div>
            <div id="helpOverlay">Orbit: drag to rotate · wheel to zoom</div>
            <div id="fpLockHint">CLICK TO LOOK · ESC TO RELEASE</div>
            <div id="toast"></div>
        </div>

        <aside id="panel">
            <header>
                <h1>PLAYER MODEL</h1>
                <div class="sub" id="panelSub">edit · preview · export</div>
            </header>

            <div id="tabs">
                <button data-tab="fp" class="active">FP RIG</button>
                <button data-tab="avatar">AVATAR</button>
            </div>

            <div id="controls"></div>
            <footer>
                <button id="resetBtn">RESET</button>
                <button id="downloadBtn">⬇ SAVE ASSET</button>
                <button id="loadBtn">⬆ LOAD ASSET</button>
                <button id="copyBtn" class="primary">COPY CONFIG</button>
            </footer>

            <input type="file" id="loadFile" accept=".js,.json" hidden>
        </aside>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="assets/model/playerModel.js"></script>
    <script src="assets/model/toolModels.js"></script>
    <script src="assets/avatarModel.js"></script>
    <script>
        (function () {
            'use strict';

            /* ============================================================
               1. FP FALLBACK + DEFAULTS
               ============================================================ */
            const FALLBACK = {
                colors: {
                    skin: 0xd4a686, pants: 0x2a3a4a,
                    boot: 0x18181a, sleeve: 0x3a4a30,
                },
                body: {
                    hipY: 0.90, legLen: 0.82, legW: 0.15, legD: 0.15, legSpread: 0.11,
                    bootW: 0.17, bootH: 0.10, bootD: 0.24, bootOffZ: 0.04,
                    torsoW: 0.38, torsoH: 0.56, torsoD: 0.22, torsoY: 1.18,
                    eyeX: 0.00, eyeY: 1.45, eyeZ: 0.00,
                },
                hands: {
                    L: { x: -0.32, y: -0.30, z: -0.34, rx: -0.22, ry: 0, rz: 0.16 },
                    R: { x: 0.28, y: -0.28, z: -0.32, rx: -0.26, ry: 0, rz: -0.14 },
                    sleeveW: 0.11, sleeveH: 0.11, sleeveL: 0.30,
                    palmW: 0.12, palmH: 0.13, palmD: 0.14,
                    thumbW: 0.04, thumbH: 0.05, thumbD: 0.07,
                    thumbX: -0.07, thumbY: 0.02, thumbZ: 0.00,
                },
                anim: {
                    legAmpWalk: 0.68, legAmpSprint: 0.95, legSway: 0.18,
                    handBob: 1.7, handBobX: 0.8,
                    swayStrength: 0.000025, swayK: 90, swayC: 22,
                    sprintLean: -0.06, breath: 0.004,
                    yawFollow: 0.35, pitchFollow: 0.50,
                }
            };

            const DEFAULTS = (function () {
                const src = window.PLAYER_MODEL_DATA;
                if (!src) return JSON.parse(JSON.stringify(FALLBACK));
                const copy = JSON.parse(JSON.stringify(src));
                for (const k of Object.keys(FALLBACK)) {
                    if (!copy[k] || typeof copy[k] !== 'object')
                        copy[k] = JSON.parse(JSON.stringify(FALLBACK[k]));
                }
                return copy;
            })();

            const STORAGE_KEY = 'ruincity-fp-editor-v1';
            let CFG = loadCfg() || JSON.parse(JSON.stringify(DEFAULTS));

            function loadCfg() {
                try {
                    const s = localStorage.getItem(STORAGE_KEY);
                    return s ? JSON.parse(s) : null;
                } catch (e) { return null; }
            }
            function saveCfg() {
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(CFG)); } catch (e) { }
            }

            /* ============================================================
               2. AVATAR FALLBACK + DEFAULTS
               ============================================================ */
            const AVATAR_FALLBACK = {
                colors: {
                    skin: 0xd4a686, hair: 0x3a2418, shirt: 0x3a4a30,
                    pants: 0x2a3a4a, boot: 0x18181a, accent: 0x808890,
                },
                body: {
                    hipY: 0.53, legLen: 0.42, legW: 0.12, legD: 0.15, legSpread: 0.10,
                    bootW: 0.17, bootH: 0.095, bootD: 0.24, bootOffZ: 0.04,
                    torsoW: 0.38, torsoH: 0.72, torsoD: 0.17, torsoY: 0.86,
                    headW: 0.22, headH: 0.22, headD: 0.22, headY: 1.31,
                    hairW: 0.24, hairH: 0.06, hairD: 0.24, hairY: 1.44,
                    armW: 0.11, armLen: 0.44, armSpread: 0.045, armY: 1.17,
                    armHandW: 0.12, armHandH: 0.13, armHandD: 0.14,
                    armHandOffset: 0.48,
                },
                parts: [],
            };

            const AVATAR_DEFAULTS = (function () {
                const src = window.AVATAR_MODEL_DATA;
                if (!src) return JSON.parse(JSON.stringify(AVATAR_FALLBACK));
                const copy = JSON.parse(JSON.stringify(src));
                for (const k of Object.keys(AVATAR_FALLBACK)) {
                    if (!copy[k] || typeof copy[k] !== 'object')
                        copy[k] = JSON.parse(JSON.stringify(AVATAR_FALLBACK[k]));
                }
                return copy;
            })();

            const AVATAR_STORAGE_KEY = 'ruincity-avatar-editor-v1';
            let AVATAR_CFG = loadAvatarCfg() || JSON.parse(JSON.stringify(AVATAR_DEFAULTS));

            function loadAvatarCfg() {
                try {
                    const s = localStorage.getItem(AVATAR_STORAGE_KEY);
                    return s ? JSON.parse(s) : null;
                } catch (e) { return null; }
            }
            function saveAvatarCfg() {
                try {
                    localStorage.setItem(AVATAR_STORAGE_KEY, JSON.stringify(AVATAR_CFG));
                } catch (e) { }
            }

            /* ============================================================
               3. FP SCHEMA
               ============================================================ */
            const SCHEMA = [
                {
                    name: 'COLORS', open: true,
                    entries: [
                        { key: 'colors.skin', label: 'Skin', type: 'color' },
                        { key: 'colors.pants', label: 'Pants', type: 'color' },
                        { key: 'colors.boot', label: 'Boots', type: 'color' },
                        { key: 'colors.sleeve', label: 'Sleeve', type: 'color' },
                    ]
                },
                {
                    name: 'BODY', open: true,
                    entries: [
                        { key: 'body.hipY', label: 'Hip height', type: 'range', min: 0.5, max: 1.3, step: 0.01 },
                        { key: 'body.legLen', label: 'Leg length', type: 'range', min: 0.4, max: 1.2, step: 0.01 },
                        { key: 'body.legW', label: 'Leg width', type: 'range', min: 0.05, max: 0.30, step: 0.005 },
                        { key: 'body.legD', label: 'Leg depth', type: 'range', min: 0.05, max: 0.30, step: 0.005 },
                        { key: 'body.legSpread', label: 'Leg spread', type: 'range', min: 0.00, max: 0.25, step: 0.005 },
                        { key: 'body.bootW', label: 'Boot width', type: 'range', min: 0.05, max: 0.35, step: 0.005 },
                        { key: 'body.bootH', label: 'Boot height', type: 'range', min: 0.02, max: 0.25, step: 0.005 },
                        { key: 'body.bootD', label: 'Boot depth', type: 'range', min: 0.08, max: 0.40, step: 0.005 },
                        { key: 'body.bootOffZ', label: 'Boot forward', type: 'range', min: -0.15, max: 0.20, step: 0.005 },
                        { key: 'body.torsoW', label: 'Torso width', type: 'range', min: 0.15, max: 0.70, step: 0.01 },
                        { key: 'body.torsoH', label: 'Torso height', type: 'range', min: 0.20, max: 1.00, step: 0.01 },
                        { key: 'body.torsoD', label: 'Torso depth', type: 'range', min: 0.10, max: 0.45, step: 0.01 },
                        { key: 'body.torsoY', label: 'Torso Y', type: 'range', min: 0.70, max: 1.70, step: 0.01 },
                    ]
                },
                {
                    name: 'EYE POSITION (FP CAMERA)', open: true,
                    entries: [
                        { key: 'body.eyeX', label: 'Eye offset X', type: 'range', min: -0.6, max: 0.6, step: 0.01 },
                        { key: 'body.eyeY', label: 'Eye height Y', type: 'range', min: 1.00, max: 2.10, step: 0.01 },
                        { key: 'body.eyeZ', label: 'Eye offset Z', type: 'range', min: -0.6, max: 0.6, step: 0.01 },
                    ]
                },
                {
                    name: 'LEFT HAND — REST POSE', open: false,
                    entries: [
                        { key: 'hands.L.x', label: 'Pos X', type: 'range', min: -0.9, max: 0.0, step: 0.01 },
                        { key: 'hands.L.y', label: 'Pos Y', type: 'range', min: -0.9, max: 0.3, step: 0.01 },
                        { key: 'hands.L.z', label: 'Pos Z', type: 'range', min: -0.9, max: 0.0, step: 0.01 },
                        { key: 'hands.L.rx', label: 'Rot X', type: 'range', min: -1.4, max: 1.4, step: 0.01 },
                        { key: 'hands.L.ry', label: 'Rot Y', type: 'range', min: -1.4, max: 1.4, step: 0.01 },
                        { key: 'hands.L.rz', label: 'Rot Z', type: 'range', min: -1.4, max: 1.4, step: 0.01 },
                    ]
                },
                {
                    name: 'RIGHT HAND — REST POSE', open: false,
                    entries: [
                        { key: 'hands.R.x', label: 'Pos X', type: 'range', min: 0.0, max: 0.9, step: 0.01 },
                        { key: 'hands.R.y', label: 'Pos Y', type: 'range', min: -0.9, max: 0.3, step: 0.01 },
                        { key: 'hands.R.z', label: 'Pos Z', type: 'range', min: -0.9, max: 0.0, step: 0.01 },
                        { key: 'hands.R.rx', label: 'Rot X', type: 'range', min: -1.4, max: 1.4, step: 0.01 },
                        { key: 'hands.R.ry', label: 'Rot Y', type: 'range', min: -1.4, max: 1.4, step: 0.01 },
                        { key: 'hands.R.rz', label: 'Rot Z', type: 'range', min: -1.4, max: 1.4, step: 0.01 },
                    ]
                },
                {
                    name: 'HAND GEOMETRY', open: false,
                    entries: [
                        { key: 'hands.sleeveW', label: 'Sleeve w', type: 'range', min: 0.05, max: 0.25, step: 0.005 },
                        { key: 'hands.sleeveH', label: 'Sleeve h', type: 'range', min: 0.05, max: 0.25, step: 0.005 },
                        { key: 'hands.sleeveL', label: 'Sleeve len', type: 'range', min: 0.05, max: 0.60, step: 0.01 },
                        { key: 'hands.palmW', label: 'Palm w', type: 'range', min: 0.05, max: 0.25, step: 0.005 },
                        { key: 'hands.palmH', label: 'Palm h', type: 'range', min: 0.05, max: 0.25, step: 0.005 },

            const AVATAR_SCHEMA = [

                            set: (v) => { previewToolId = v; }
