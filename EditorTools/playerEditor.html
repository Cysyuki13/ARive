                    ]
                },
            ];

            /* ============================================================
               5. THREE.JS SETUP
               ============================================================ */
            const viewportEl = document.getElementById('viewport');
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x10141a, 1);
            viewportEl.appendChild(renderer.domElement);

            const scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x10141a, 6, 16);

            scene.add(new THREE.AmbientLight(0xa8b0c0, 0.55));
            const key = new THREE.DirectionalLight(0xffe0b0, 0.85);
            key.position.set(2, 4, 2);
            scene.add(key);
            const fill = new THREE.DirectionalLight(0x8090b0, 0.35);
            fill.position.set(-2, 1, -2);
            scene.add(fill);
            const rim = new THREE.DirectionalLight(0xc0d8ff, 0.25);
            rim.position.set(0, 1, -3);
            scene.add(rim);

            const grid = new THREE.GridHelper(10, 20, 0x2a3a4a, 0x1a2028);
            grid.position.y = 0.001;
            scene.add(grid);

            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(20, 20),
                new THREE.MeshLambertMaterial({ color: 0x14191f })
            );
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const fpCamera = new THREE.PerspectiveCamera(76, 1, 0.04, 200);
            fpCamera.rotation.order = 'YXZ';
            scene.add(fpCamera);

            const orbitCamera = new THREE.PerspectiveCamera(45, 1, 0.01, 200);

            const eyeProxy = new THREE.Mesh(
                new THREE.SphereGeometry(0.04, 16, 12),
                new THREE.MeshBasicMaterial({ color: 0xffe0a0 })
            );
            scene.add(eyeProxy);

            /* ---------- Shared FP materials ---------- */
            const SKIN_MAT = new THREE.MeshLambertMaterial({ color: CFG.colors.skin, fog: true });
            const PANTS_MAT = new THREE.MeshLambertMaterial({ color: CFG.colors.pants, fog: true });
            const BOOT_MAT = new THREE.MeshLambertMaterial({ color: CFG.colors.boot, fog: true });
            const SLEEVE_MAT = new THREE.MeshLambertMaterial({ color: CFG.colors.sleeve, fog: true });

            /* ============================================================
               6. FP RIG
               ============================================================ */
            const playerBody = new THREE.Group();
            scene.add(playerBody);

            const headGroup = new THREE.Group();
            headGroup.position.set(CFG.body.eyeX, CFG.body.eyeY, CFG.body.eyeZ);
            playerBody.add(headGroup);

            const rig = {
                legLPivot: null, legRPivot: null,
                handL: null, handR: null,
            };

            function disposeGroup(g) {
                g.traverse(o => { if (o.geometry) o.geometry.dispose(); });
                while (g.children.length) g.remove(g.children[0]);
            }

            function buildRig() {
                disposeGroup(playerBody);
                disposeGroup(headGroup);

                rig.legLPivot = buildLeg(-1);
                rig.legRPivot = buildLeg(+1);
                playerBody.add(rig.legLPivot);
                playerBody.add(rig.legRPivot);

                const torso = new THREE.Mesh(
                    new THREE.BoxGeometry(CFG.body.torsoW, CFG.body.torsoH, CFG.body.torsoD),
                    PANTS_MAT
                );
                torso.position.set(0, CFG.body.torsoY, 0);
                playerBody.add(torso);

                rig.handL = buildHand(-1);
                rig.handR = buildHand(+1);
                headGroup.add(rig.handL);
                headGroup.add(rig.handR);

                headGroup.position.set(CFG.body.eyeX, CFG.body.eyeY, CFG.body.eyeZ);
                headGroup.rotation.set(0, 0, 0);

                if (headGroup.parent !== playerBody) playerBody.add(headGroup);
            }

            function buildLeg(side) {
                const pivot = new THREE.Group();
                pivot.position.set(CFG.body.legSpread * side, CFG.body.hipY, 0);

                const leg = new THREE.Mesh(
                    new THREE.BoxGeometry(CFG.body.legW, CFG.body.legLen, CFG.body.legD),
                    PANTS_MAT
                );
                leg.position.set(0, -CFG.body.legLen * 0.5, 0);
                pivot.add(leg);

                const boot = new THREE.Mesh(
                    new THREE.BoxGeometry(CFG.body.bootW, CFG.body.bootH, CFG.body.bootD),
                    BOOT_MAT
                );
                boot.position.set(
                    0,
                    -CFG.body.legLen * 0.5 - CFG.body.bootH * 0.5 - 0.01,
                    CFG.body.bootOffZ
                );
                leg.add(boot);

                return pivot;
            }

            function buildHand(side) {
                const group = new THREE.Group();

                const sleeve = new THREE.Mesh(
                    new THREE.BoxGeometry(CFG.hands.sleeveW, CFG.hands.sleeveH, CFG.hands.sleeveL),
                    SLEEVE_MAT
                );
                sleeve.position.set(0, 0, CFG.hands.sleeveL * 0.5);
                group.add(sleeve);

                const palm = new THREE.Mesh(
                    new THREE.BoxGeometry(CFG.hands.palmW, CFG.hands.palmH, CFG.hands.palmD),
                    SKIN_MAT
                );
                palm.position.set(0, 0, -CFG.hands.palmD * 0.5);
                group.add(palm);

                const thumb = new THREE.Mesh(
                    new THREE.BoxGeometry(CFG.hands.thumbW, CFG.hands.thumbH, CFG.hands.thumbD),
                    SKIN_MAT
                );
                const thumbOffX = CFG.hands.thumbX * side;
                const thumbOffY = CFG.hands.thumbY;
                const thumbOffZ = CFG.hands.thumbZ - CFG.hands.palmD * 0.5;
                thumb.position.set(thumbOffX, thumbOffY, thumbOffZ);
                group.add(thumb);

                return group;
            }

            function applyColors() {
                SKIN_MAT.color.setHex(CFG.colors.skin);
                PANTS_MAT.color.setHex(CFG.colors.pants);
                BOOT_MAT.color.setHex(CFG.colors.boot);
                SLEEVE_MAT.color.setHex(CFG.colors.sleeve);
            }

            /* ============================================================
               7. AVATAR RIG (third-person, seen by others)
               ============================================================ */
            const avatarGroup = new THREE.Group();
            avatarGroup.visible = false;
            scene.add(avatarGroup);

            let previewToolId = 'none';
            const AVATAR_PARENTS = ['head', 'torso', 'hip', 'armL', 'armR', 'legL', 'legR'];

            /* Local mini item-mesh builder (mirrors game.js buildItemMesh). */
            function buildEditorItemMesh(model) {
                const g = new THREE.Group();
                for (const b of model) {
                    const mat = new THREE.MeshLambertMaterial({ color: b.c, fog: true });
                    const m = new THREE.Mesh(
                        new THREE.BoxGeometry(b.s[0], b.s[1], b.s[2]), mat);
                    m.position.set(b.p[0], b.p[1], b.p[2]);
                    if (b.r) m.rotation.set(b.r[0], b.r[1], b.r[2]);
                    g.add(m);
                }
                return g;
            }

            function buildAvatarRig() {
                disposeGroup(avatarGroup);

                const B = AVATAR_CFG.body, C = AVATAR_CFG.colors;
                const lam = (hex) => new THREE.MeshLambertMaterial({ color: hex, fog: true });
                const SKIN = lam(C.skin);
                const HAIR = lam(C.hair);
                const SHIRT = lam(C.shirt);
                const PANTS = lam(C.pants);
                const BOOT = lam(C.boot);

                function buildLeg(side) {
                    const pivot = new THREE.Group();
                    pivot.position.set(B.legSpread * side, B.hipY, 0);
                    const leg = new THREE.Mesh(
                        new THREE.BoxGeometry(B.legW, B.legLen, B.legD), PANTS);
                    leg.position.y = -B.legLen * 0.5;
                    pivot.add(leg);
                    const boot = new THREE.Mesh(
                        new THREE.BoxGeometry(B.bootW, B.bootH, B.bootD), BOOT);
                    boot.position.set(
                        0,
                        -B.legLen * 0.5 - B.bootH * 0.5 - 0.01,
                        B.bootOffZ
                    );
                    leg.add(boot);
                    return pivot;
                }
                const legL = buildLeg(-1), legR = buildLeg(+1);
                avatarGroup.add(legL, legR);

                const torso = new THREE.Mesh(
                    new THREE.BoxGeometry(B.torsoW, B.torsoH, B.torsoD), SHIRT);
                torso.position.y = B.torsoY;
                avatarGroup.add(torso);

                const head = new THREE.Mesh(
                    new THREE.BoxGeometry(B.headW, B.headH, B.headD), SKIN);
                head.position.y = B.headY;
                avatarGroup.add(head);

                const hair = new THREE.Mesh(
                    new THREE.BoxGeometry(B.hairW, B.hairH, B.hairD), HAIR);
                hair.position.y = B.hairY;
                avatarGroup.add(hair);

                function buildArm(side) {
                    const pivot = new THREE.Group();
                    pivot.position.set(
                        side * (B.torsoW * 0.5 + B.armSpread), B.armY, 0);

                    const arm = new THREE.Mesh(
                        new THREE.BoxGeometry(B.armW, B.armLen, B.armW), SHIRT);
                    arm.position.y = -B.armLen * 0.5;
                    pivot.add(arm);

                    const hand = new THREE.Mesh(
                        new THREE.BoxGeometry(B.armHandW, B.armHandH, B.armHandD), SKIN);
                    hand.position.y = -B.armHandOffset;
                    pivot.add(hand);

                    const attach = new THREE.Group();
                    attach.position.y = -B.armHandOffset;
                    pivot.add(attach);
                    pivot.userData.handAttach = attach;

                    return pivot;
                }
                const armL = buildArm(-1), armR = buildArm(+1);
                avatarGroup.add(armL, armR);

                /* ---- Accessory cubes ---- */
                const parentMap = {
                    head: head, torso: torso, hip: avatarGroup,
                    armL: armL, armR: armR, legL: legL, legR: legR,
                };
                for (const p of (AVATAR_CFG.parts || [])) {
                    const parent = parentMap[p.parent] || avatarGroup;
                    const cube = new THREE.Mesh(
                        new THREE.BoxGeometry(p.s[0], p.s[1], p.s[2]),
                        lam(p.c)
                    );
                    cube.position.set(p.p[0], p.p[1], p.p[2]);
                    if (p.r) cube.rotation.set(p.r[0], p.r[1], p.r[2]);
                    parent.add(cube);
                }

                /* ---- Tool preview on right hand ---- */
                if (previewToolId !== 'none' &&
                    window.TOOL_HELD_DATA &&
                    window.TOOL_HELD_DATA[previewToolId]) {
                    const def = window.TOOL_HELD_DATA[previewToolId];
                    const holder = new THREE.Group();
                    holder.position.set(def.pose.p[0], def.pose.p[1], def.pose.p[2]);
                    holder.rotation.set(def.pose.r[0], def.pose.r[1], def.pose.r[2]);
                    holder.add(buildEditorItemMesh(def.model));
                    armR.userData.handAttach.add(holder);
                }

                avatarGroup.userData = { legL, legR, armL, armR, torso, head, hair };
            }

            /* ============================================================
               8. ANIMATION
               ============================================================ */
            let swayYaw = 0, swayPitch = 0;
            let swayYawVel = 0, swayPitchVel = 0;

            let walking = false;
            let sprinting = false;
            let bobPhase = 0;
            let manualSwayY = 0;
            let manualSwayX = 0;

            let fpYaw = 0, fpPitch = 0;
            let fpLocked = false;

            function animate(dt) {
                if (walking || sprinting) {
                    bobPhase += dt * (sprinting ? 13 : 9);
                }
                bobPhase %= Math.PI * 2;

                animateFP(dt);
                animateAvatar(dt);
            }

            function animateFP(dt) {
                swayYawVel += (-CFG.anim.swayK * swayYaw - CFG.anim.swayC * swayYawVel) * dt;
                swayPitchVel += (-CFG.anim.swayK * swayPitch - CFG.anim.swayC * swayPitchVel) * dt;
                swayYaw += swayYawVel * dt;
                swayPitch += swayPitchVel * dt;
                swayYaw = Math.max(-0.24, Math.min(0.24, swayYaw));
                swayPitch = Math.max(-0.20, Math.min(0.20, swayPitch));

                const effSwayY = swayYaw + manualSwayY;
                const effSwayX = swayPitch + manualSwayX;

                const moving = walking || sprinting;
                const bobA = moving ? (sprinting ? 0.055 : 0.032) : 0.006;

                let legSwing = 0;
                if (moving) legSwing = Math.sin(bobPhase);
                const amp = moving
                    ? (sprinting ? CFG.anim.legAmpSprint : CFG.anim.legAmpWalk)
                    : 0;

                if (rig.legLPivot) {
                    rig.legLPivot.rotation.x = legSwing * amp;
                    rig.legRPivot.rotation.x = -legSwing * amp;

                    const swayAmt = amp * CFG.anim.legSway;
                    rig.legLPivot.rotation.z = -swayAmt * Math.abs(legSwing);
                    rig.legRPivot.rotation.z = swayAmt * Math.abs(legSwing);
                }

                const bobScale = moving ? 1.0 : 0.0;
                const bobY_L = Math.sin(bobPhase) * bobA * CFG.anim.handBob * bobScale;
                const bobY_R = Math.sin(bobPhase + Math.PI) * bobA * CFG.anim.handBob * bobScale;
                const bobX = Math.cos(bobPhase * 0.5) * bobA * CFG.anim.handBobX * bobScale;
                const breath = Math.sin(bobPhase * 0.35) * CFG.anim.breath;
                const sprintLean = sprinting && moving ? CFG.anim.sprintLean : 0;

                if (rig.handL) {
                    rig.handL.position.set(
                        CFG.hands.L.x + bobX + effSwayY * 0.9,
                        CFG.hands.L.y + bobY_L + effSwayX * 0.4 + breath,
                        CFG.hands.L.z + sprintLean
                    );
                    rig.handL.rotation.set(
                        CFG.hands.L.rx + effSwayX * 1.2,
                        CFG.hands.L.ry + effSwayY * 0.8,
                        CFG.hands.L.rz + effSwayY * 1.0
                    );

                    rig.handR.position.set(
                        CFG.hands.R.x + bobX + effSwayY * 0.9,
                        CFG.hands.R.y + bobY_R + effSwayX * 0.4 + breath,
                        CFG.hands.R.z + sprintLean
                    );
                    rig.handR.rotation.set(
                        CFG.hands.R.rx + effSwayX * 1.2,
                        CFG.hands.R.ry + effSwayY * 0.8,
                        CFG.hands.R.rz + effSwayY * 1.0
                    );
                }

                const camY = CFG.body.eyeY + Math.sin(bobPhase) * bobA * bobScale;
                fpCamera.position.set(CFG.body.eyeX, camY, CFG.body.eyeZ);

                if (viewMode === 'fp' && editMode === 'fp') {
                    fpCamera.rotation.set(fpPitch, fpYaw, 0);
                } else {
                    fpCamera.rotation.set(0, 0, 0);
                }

                const yawFollow = (typeof CFG.anim.yawFollow === 'number')
                    ? CFG.anim.yawFollow : 0.35;
                const pitchFollow = (typeof CFG.anim.pitchFollow === 'number')
                    ? CFG.anim.pitchFollow : 0.50;

                if (viewMode === 'fp' && editMode === 'fp') {
                    headGroup.rotation.y = fpYaw * yawFollow;
                    headGroup.rotation.x = fpPitch * pitchFollow;
                } else {
                    headGroup.rotation.y = 0;
                    headGroup.rotation.x = 0;
                }

                eyeProxy.position.copy(fpCamera.position);
            }

            function animateAvatar(dt) {
                const refs = avatarGroup.userData;
                if (!refs || !refs.legL) return;

                const moving = walking || sprinting;

                let legSwing = 0;
                if (moving) legSwing = Math.sin(bobPhase);

                const amp = moving ? (sprinting ? 0.46 : 0.64) : 0;
                refs.legL.rotation.x = legSwing * amp;
                refs.legR.rotation.x = -legSwing * amp;
                refs.armL.rotation.x = -legSwing * amp * 0.55;
                refs.armR.rotation.x = legSwing * amp * 0.55;
            }

            /* ============================================================
               9. MODE STATE
               ============================================================ */
            let editMode = 'fp';       // 'fp' | 'avatar'
            let viewMode = 'fp';       // 'fp' | 'orbit'

            function activeCfg() { return editMode === 'avatar' ? AVATAR_CFG : CFG; }
            function activeSchema() { return editMode === 'avatar' ? AVATAR_SCHEMA : SCHEMA; }

            function onActiveConfigChanged() {
                if (editMode === 'avatar') {
                    saveAvatarCfg();
                    scheduleAvatarRebuild();
                } else {
                    saveCfg();
                    applyColors();
                    scheduleFpRebuild();
                }
            }

            let fpRebuildQueued = false;
            let avatarRebuildQueued = false;

            function scheduleFpRebuild() {
                if (fpRebuildQueued) return;
                fpRebuildQueued = true;
                requestAnimationFrame(() => {
                    fpRebuildQueued = false;
                    buildRig();
                });
            }
            function scheduleAvatarRebuild() {
                if (avatarRebuildQueued) return;
                avatarRebuildQueued = true;
                requestAnimationFrame(() => {
                    avatarRebuildQueued = false;
                    buildAvatarRig();
                });
            }

            /* ============================================================
               10. PANEL BUILD
               ============================================================ */
            const controlsEl = document.getElementById('controls');

            function getPath(obj, path) {
                return path.split('.').reduce((o, k) => o[k], obj);
            }
            function setPath(obj, path, val) {
                const parts = path.split('.');
                let o = obj;
                for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
                o[parts[parts.length - 1]] = val;
            }
            function numToHex(n) { return '#' + n.toString(16).padStart(6, '0'); }
            function hexToNum(s) { return parseInt(s.slice(1), 16); }

            function buildPanel() {
                controlsEl.innerHTML = '';
                const cfg = activeCfg();
                const schema = activeSchema();

                for (const sec of schema) {
                    const det = document.createElement('details');
                    if (sec.open) det.open = true;

                    const sum = document.createElement('summary');
                    sum.textContent = sec.name;
                    det.appendChild(sum);

                    for (const e of sec.entries) {
                        const row = document.createElement('div');
                        row.className = 'entry';

                        const lbl = document.createElement('div');
                        lbl.className = 'lbl';
                        lbl.textContent = e.label;
                        row.appendChild(lbl);

                        if (e.type === 'range') {
                            const rng = document.createElement('input');
                            rng.type = 'range';
                            rng.min = e.min; rng.max = e.max; rng.step = e.step;
                            rng.value = getPath(cfg, e.key);
                            row.appendChild(rng);

                            const num = document.createElement('input');
                            num.type = 'number';
                            num.step = e.step;
                            num.value = getPath(cfg, e.key);
                            row.appendChild(num);

                            const commit = (v) => {
                                const val = Math.max(e.min, Math.min(e.max, parseFloat(v)));
                                if (!isFinite(val)) return;
                                setPath(cfg, e.key, val);
                                rng.value = val; num.value = val;
                                onActiveConfigChanged();
                            };
                            rng.addEventListener('input', () => commit(rng.value));
                            num.addEventListener('input', () => commit(num.value));
                        }
                        else if (e.type === 'color') {
                            const col = document.createElement('input');
                            col.type = 'color';
                            col.value = numToHex(getPath(cfg, e.key));
                            row.appendChild(col);
                            const spacer = document.createElement('div');
                            row.appendChild(spacer);
                            col.addEventListener('input', () => {
                                setPath(cfg, e.key, hexToNum(col.value));
                                onActiveConfigChanged();
                            });
                        }
                        else if (e.type === 'select') {
                            const sel = document.createElement('select');
                            for (const opt of e.options) {
                                const o = document.createElement('option');
                                o.value = opt; o.textContent = opt;
                                sel.appendChild(o);
                            }
                            sel.value = e.get ? e.get() : getPath(cfg, e.key);
                            row.appendChild(sel);
                            sel.addEventListener('change', () => {
                                if (e.set) e.set(sel.value);
                                else setPath(cfg, e.key, sel.value);
                                onActiveConfigChanged();
                            });
                        }

                        det.appendChild(row);
                    }

                    controlsEl.appendChild(det);
                }

                /* ---- Avatar-only: parts editor ---- */
                if (editMode === 'avatar') {
                    controlsEl.appendChild(buildPartsSection());
                }

                /* ---- Import / Export ---- */
                controlsEl.appendChild(buildImportExportSection());
            }

            /* ============================================================
               11. PARTS EDITOR (accessories)
               ============================================================ */
            function buildPartsSection() {
                const det = document.createElement('details');
                det.open = true;

                const sum = document.createElement('summary');
                sum.textContent = 'PARTS (ACCESSORIES)';
                det.appendChild(sum);

                const wrap = document.createElement('div');

                (AVATAR_CFG.parts || []).forEach((p, idx) => {
                    wrap.appendChild(buildPartCard(p, idx));
                });

                const addBtn = document.createElement('button');
                addBtn.className = 'add-part-btn';
                addBtn.textContent = '+ ADD PART';
                addBtn.addEventListener('click', () => {
                    AVATAR_CFG.parts = AVATAR_CFG.parts || [];
                    AVATAR_CFG.parts.push({
                        p: [0, 0, 0], s: [0.15, 0.15, 0.15],
                        c: 0x808890, parent: 'head'
                    });
                    saveAvatarCfg();
                    buildPanel();
                    scheduleAvatarRebuild();
                });
                wrap.appendChild(addBtn);

                det.appendChild(wrap);
                return det;
            }

            function buildPartCard(p, idx) {
                const card = document.createElement('div');
                card.className = 'part-card';

                const head = document.createElement('div');
                head.className = 'part-head';
                const title = document.createElement('b');
                title.textContent = 'PART ' + (idx + 1);
                head.appendChild(title);

                const removeBtn = document.createElement('button');
                removeBtn.textContent = '✕ REMOVE';
                removeBtn.addEventListener('click', () => {
                    AVATAR_CFG.parts.splice(idx, 1);
                    saveAvatarCfg();
                    buildPanel();
                    scheduleAvatarRebuild();
                });
                head.appendChild(removeBtn);
                card.appendChild(head);

                /* Parent dropdown */
                const parentRow = document.createElement('div');
                parentRow.className = 'part-row';
                const parentLbl = document.createElement('div');
                parentLbl.className = 'lbl';
                parentLbl.textContent = 'ATTACH TO';
                parentRow.appendChild(parentLbl);
                const parentSel = document.createElement('select');
                for (const par of AVATAR_PARENTS) {
                    const o = document.createElement('option');
                    o.value = par; o.textContent = par;
                    parentSel.appendChild(o);
                }
                parentSel.value = p.parent || 'head';
                parentSel.addEventListener('change', () => {
                    p.parent = parentSel.value;
                    saveAvatarCfg();
                    scheduleAvatarRebuild();
                });
                parentRow.appendChild(parentSel);
                card.appendChild(parentRow);

                /* Position + size sliders */
                const axes = ['X', 'Y', 'Z'];
                for (let a = 0; a < 3; a++) {
                    card.appendChild(partSlider('POS ' + axes[a], p, 'p', a, -0.6, 0.6, 0.01));
                }
                for (let a = 0; a < 3; a++) {
                    card.appendChild(partSlider('SIZE ' + axes[a], p, 's', a, 0.01, 0.6, 0.005));
                }

                /* Color */
                const colRow = document.createElement('div');
                colRow.className = 'part-row';
                const colLbl = document.createElement('div');
                colLbl.className = 'lbl';
                colLbl.textContent = 'COLOR';
                colRow.appendChild(colLbl);
                const colIn = document.createElement('input');
                colIn.type = 'color';
                colIn.value = numToHex(p.c);
                colIn.style.gridColumn = '2 / 4';
                colIn.addEventListener('input', () => {
                    p.c = hexToNum(colIn.value);
                    saveAvatarCfg();
                    scheduleAvatarRebuild();
                });
                colRow.appendChild(colIn);
                card.appendChild(colRow);

                return card;
            }

            function partSlider(label, target, key, axis, min, max, step) {
                const row = document.createElement('div');
                row.className = 'part-row';

                const lbl = document.createElement('div');
                lbl.className = 'lbl';
                lbl.textContent = label;
                row.appendChild(lbl);

                const rng = document.createElement('input');
                rng.type = 'range';
                rng.min = min; rng.max = max; rng.step = step;
                rng.value = target[key][axis];
                row.appendChild(rng);

                const num = document.createElement('input');
                num.type = 'number';
                num.step = step;
                num.value = target[key][axis];
                row.appendChild(num);

                const commit = (v) => {
                    const val = Math.max(min, Math.min(max, parseFloat(v)));
                    if (!isFinite(val)) return;
                    target[key][axis] = val;
                    rng.value = val; num.value = val;
                    saveAvatarCfg();
                    scheduleAvatarRebuild();
                };
                rng.addEventListener('input', () => commit(rng.value));
                num.addEventListener('input', () => commit(num.value));

                return row;
            }

            /* ============================================================
               12. IMPORT / EXPORT UI
               ============================================================ */
            function buildImportExportSection() {
                const det = document.createElement('details');
                det.id = 'ioSection';
                det.open = false;

                const sum = document.createElement('summary');
                sum.textContent = 'IMPORT / EXPORT';
                det.appendChild(sum);

                const wrap = document.createElement('div');
                wrap.className = 'io-wrap';

                const help = document.createElement('div');
                help.className = 'io-help';
                help.innerHTML = editMode === 'avatar'
                    ? '<b>AVATAR EXPORT</b><br>' +
                      'Produces <code>window.AVATAR_MODEL_DATA = {...}</code>.<br>' +
                      'Save it to <code>assets/avatarModel.js</code>. ' +
                      'This is what other players see in multiplayer.'
                    : '<b>FP RIG EXPORT</b><br>' +
                      'Produces <code>window.PLAYER_MODEL_DATA = {...}</code>.<br>' +
                      'Save it to <code>assets/model/playerModel.js</code>. ' +
                      'This drives your first-person hands and camera.';
                wrap.appendChild(help);

                const ta = document.createElement('textarea');
                ta.className = 'io-textarea';
                ta.id = 'importArea';
                ta.spellcheck = false;
                ta.placeholder = '/* Paste a previously exported block here... */';
                wrap.appendChild(ta);

                const row = document.createElement('div');
                row.className = 'io-row';

                const importBtn = document.createElement('button');
                importBtn.className = 'primary';
                importBtn.textContent = 'IMPORT';
                importBtn.addEventListener('click', doImport);
                row.appendChild(importBtn);

                const exportBtn = document.createElement('button');
                exportBtn.textContent = 'EXPORT (COPY)';
                exportBtn.addEventListener('click', doExport);
                row.appendChild(exportBtn);

                wrap.appendChild(row);

                const status = document.createElement('div');
                status.className = 'io-status';
                status.id = 'ioStatus';
                wrap.appendChild(status);

                det.appendChild(wrap);
                return det;
            }

            function setIoStatus(msg, cls) {
                const el = document.getElementById('ioStatus');
                if (!el) return;
                el.textContent = msg;
                el.className = 'io-status' + (cls ? ' ' + cls : '');
            }

            function doExport() {
                const txt = editMode === 'avatar'
                    ? renderAvatarConfigJS()
                    : renderConfigJS();
                const ta = document.getElementById('importArea');
                if (ta) ta.value = txt;
                navigator.clipboard.writeText(txt).then(
                    () => { setIoStatus('EXPORTED · COPIED TO CLIPBOARD', 'ok'); showToast('CONFIG COPIED'); },
                    () => { setIoStatus('EXPORTED · COPY FAILED, SELECTED BELOW', 'err'); showToast('COPY FAILED'); }
                );
            }

            function doImport() {
                const ta = document.getElementById('importArea');
                if (!ta) return;
                const text = ta.value.trim();
                if (!text) { setIoStatus('NOTHING TO IMPORT', 'err'); return; }

                const obj = tryParseConfig(text);
                if (!obj) { setIoStatus('PARSE FAILED — CHECK FORMAT', 'err'); return; }

                if (editMode === 'avatar') {
                    deepAssign(AVATAR_CFG, obj);
                    if (Array.isArray(obj.parts)) AVATAR_CFG.parts = obj.parts;
                    saveAvatarCfg();
                    buildAvatarRig();
                } else {
                    deepAssign(CFG, obj);
                    saveCfg();
                    applyColors();
                    buildRig();
                }
                buildPanel();
                setIoStatus('IMPORTED · ' + Object.keys(obj).length + ' TOP-LEVEL KEYS APPLIED', 'ok');
                showToast('CONFIG IMPORTED');
            }

            function tryParseConfig(text) {
                const start = text.indexOf('{');
                const end = text.lastIndexOf('}');
                if (start < 0 || end <= start) return null;
                const objText = text.slice(start, end + 1);
                try {
                    return new Function('return (' + objText + ');')();
                } catch (e) {
                    console.warn('Import parse error:', e);
                    return null;
                }
            }

            function deepAssign(target, source) {
                for (const k of Object.keys(source)) {
                    if (!(k in target)) continue;
                    if (target[k] && source[k] &&
                        typeof target[k] === 'object' && typeof source[k] === 'object' &&
                        !Array.isArray(target[k])) {
                        deepAssign(target[k], source[k]);
                    } else {
                        target[k] = source[k];
                    }
                }
            }

            /* ============================================================
               13. TABS
               ============================================================ */
            const panelSubEl = document.getElementById('panelSub');

            document.querySelectorAll('#tabs button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const tab = btn.dataset.tab;
                    if (editMode === tab) return;
                    editMode = tab;

                    document.querySelectorAll('#tabs button').forEach(b =>
                        b.classList.toggle('active', b === btn));

                    if (editMode === 'avatar') {
                        playerBody.visible = false;
                        headGroup.visible = false;
                        avatarGroup.visible = true;
                        avatarGroup.position.set(0, 0, 0);
                        panelSubEl.textContent = 'third-person · seen by others';
                        setView('orbit');
                    } else {
                        playerBody.visible = true;
                        headGroup.visible = true;
                        avatarGroup.visible = false;
                        panelSubEl.textContent = 'first-person · seen by you';
                        setView('fp');
                    }

                    buildPanel();
                });
            });

            /* ============================================================
               14. VIEW + ANIMATION CONTROLS
               ============================================================ */
            const viewFPBtn = document.getElementById('viewFP');
            const viewOrbitBtn = document.getElementById('viewOrbit');

            viewFPBtn.addEventListener('click', () => {
                if (editMode === 'avatar') return;   // avatar is orbit-only
                setView('fp');
            });
            viewOrbitBtn.addEventListener('click', () => setView('orbit'));

            function setView(v) {
                if (viewMode === v) return;
                viewMode = v;

                if (v !== 'fp' && document.pointerLockElement === renderer.domElement) {
                    document.exitPointerLock();
                }
                if (v === 'fp') { fpYaw = 0; fpPitch = 0; }

                viewFPBtn.classList.toggle('active', v === 'fp');
                viewOrbitBtn.classList.toggle('active', v === 'orbit');

                document.getElementById('helpOverlay').style.display =
                    v === 'orbit' ? 'block' : 'none';
                updateFpLockHint();
            }

            function updateFpLockHint() {
                const hint = document.getElementById('fpLockHint');
                hint.style.display =
                    (viewMode === 'fp' && !fpLocked && editMode === 'fp') ? 'block' : 'none';
            }

            document.getElementById('walkChk').addEventListener('change', e => walking = e.target.checked);
            document.getElementById('sprintChk').addEventListener('change', e => sprinting = e.target.checked);

            const phaseSld = document.getElementById('phaseSld');
            phaseSld.addEventListener('input', () => {
                bobPhase = parseFloat(phaseSld.value);
                if (walking || sprinting) {
                    walking = false; sprinting = false;
                    document.getElementById('walkChk').checked = false;
                    document.getElementById('sprintChk').checked = false;
                }
            });

            document.getElementById('swayYSld').addEventListener('input', e => manualSwayY = parseFloat(e.target.value));
            document.getElementById('swayXSld').addEventListener('input', e => manualSwayX = parseFloat(e.target.value));

            /* ============================================================
               15. FP MOUSE LOOK
               ============================================================ */
            renderer.domElement.addEventListener('click', () => {
                if (viewMode !== 'fp' || editMode !== 'fp') return;
                if (!fpLocked) renderer.domElement.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                fpLocked = (document.pointerLockElement === renderer.domElement);
                updateFpLockHint();
            });

            document.addEventListener('mousemove', (e) => {
                if (fpLocked) {
                    const s = 0.0020;
                    fpYaw -= e.movementX * s;
                    fpPitch -= e.movementY * s;
                    fpPitch = Math.max(-1.5, Math.min(1.5, fpPitch));
                    return;
                }
                if (!orbitDragging) return;
                orbitYaw -= (e.clientX - lastMX) * 0.008;
                orbitPitch += (e.clientY - lastMY) * 0.008;
                orbitPitch = Math.max(-1.3, Math.min(1.3, orbitPitch));
                lastMX = e.clientX;
                lastMY = e.clientY;
            });

            /* ============================================================
               16. ORBIT CONTROLS
               ============================================================ */
            let orbitYaw = 0.65, orbitPitch = 0.30, orbitDist = 3.2;
            let orbitDragging = false;
            let lastMX = 0, lastMY = 0;

            renderer.domElement.addEventListener('mousedown', e => {
                if (viewMode !== 'orbit') return;
                orbitDragging = true;
                lastMX = e.clientX;
                lastMY = e.clientY;
            });
            window.addEventListener('mouseup', () => orbitDragging = false);

            renderer.domElement.addEventListener('wheel', e => {
                if (viewMode !== 'orbit') return;
                e.preventDefault();
                orbitDist *= (e.deltaY > 0 ? 1.1 : 0.9);
                orbitDist = Math.max(0.6, Math.min(12, orbitDist));
            }, { passive: false });

            function updateOrbitCamera() {
                const targetY = editMode === 'avatar'
                    ? AVATAR_CFG.body.hipY
                    : CFG.body.hipY;
                const cx = Math.sin(orbitYaw) * Math.cos(orbitPitch) * orbitDist;
                const cy = targetY + Math.sin(orbitPitch) * orbitDist;
                const cz = Math.cos(orbitYaw) * Math.cos(orbitPitch) * orbitDist;
                orbitCamera.position.set(cx, cy, cz);
                orbitCamera.lookAt(0, targetY, 0);
            }

            /* ============================================================
               17. RESIZE
               ============================================================ */
            function resize() {
                const w = viewportEl.clientWidth;
                const h = viewportEl.clientHeight;
                renderer.setSize(w, h, false);
                fpCamera.aspect = w / h;
                fpCamera.updateProjectionMatrix();
                orbitCamera.aspect = w / h;
                orbitCamera.updateProjectionMatrix();
            }
            window.addEventListener('resize', resize);

            /* ============================================================
               18. FOOTER BUTTONS
               ============================================================ */
            document.getElementById('resetBtn').addEventListener('click', () => {
                if (!confirm('Reset all values to defaults?')) return;
                if (editMode === 'avatar') {
                    AVATAR_CFG = JSON.parse(JSON.stringify(AVATAR_DEFAULTS));
                    saveAvatarCfg();
                    buildAvatarRig();
                } else {
                    CFG = JSON.parse(JSON.stringify(DEFAULTS));
                    saveCfg();
                    applyColors();
                    buildRig();
                }
                buildPanel();
                showToast('RESET');
            });

            document.getElementById('copyBtn').addEventListener('click', () => {
                const txt = editMode === 'avatar'
                    ? renderAvatarConfigJS()
                    : renderConfigJS();
                const ta = document.getElementById('importArea');
                if (ta) ta.value = txt;
                navigator.clipboard.writeText(txt).then(
                    () => { setIoStatus('COPIED TO CLIPBOARD', 'ok'); showToast('CONFIG COPIED'); },
                    () => {
                        setIoStatus('COPY FAILED · SHOWN IN IMPORT BOX', 'err');
                        showToast('COPIED TO CONSOLE');
                        console.log(txt);
                    }
                );
            });

            document.getElementById('downloadBtn').addEventListener('click', () => {
                if (editMode === 'avatar') {
                    const body = renderAvatarConfigJS();
                    const file =
                        '/* =========================================================================\n' +
                        '   ARive — AVATAR (third-person body) external data\n' +
                        '   -------------------------------------------------------------------------\n' +
                        '   Loaded by index.html (before game.js) and PlayerEditor.html.\n' +
                        '   Generated by PlayerEditor.html — overwrite assets/avatarModel.js with this.\n' +
                        '   ========================================================================= */\n' +
                        body;
                    downloadFile(file, 'avatarModel.js');
                    showToast('SAVED — REPLACE assets/avatarModel.js');
                } else {
                    const body = renderConfigJS()
                        .replace(/\/\* =+ PLAYER_MODEL CONFIG[\s\S]*?\*\//, '');
                    const file =
                        '/* =========================================================================\n' +
                        '   ARive — PLAYER (first-person view model) external data\n' +
                        '   -------------------------------------------------------------------------\n' +
                        '   Loaded by index.html (before game.js) and PlayerEditor.html.\n' +
                        '   Generated by PlayerEditor.html — overwrite assets/model/playerModel.js with this.\n' +
                        '   ========================================================================= */\n' +
                        body;
                    downloadFile(file, 'playerModel.js');
                    showToast('SAVED — REPLACE assets/model/playerModel.js');
                }
            });

            function downloadFile(text, name) {
                const blob = new Blob([text], { type: 'text/javascript' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = name;
                a.click();
                URL.revokeObjectURL(url);
            }

            document.getElementById('loadBtn').addEventListener('click', () => {
                document.getElementById('loadFile').click();
            });

            document.getElementById('loadFile').addEventListener('change', (e) => {
                const f = e.target.files && e.target.files[0];
                if (!f) return;
                const r = new FileReader();
                r.onload = () => {
                    try {
                        const data = parseAssetFile(r.result);
                        if (!data || typeof data !== 'object') throw new Error('No data found');

                        const copy = JSON.parse(JSON.stringify(data));
                        const fallback = editMode === 'avatar' ? AVATAR_FALLBACK : FALLBACK;
                        for (const k of Object.keys(fallback)) {
                            if (!copy[k] || typeof copy[k] !== 'object')
                                copy[k] = JSON.parse(JSON.stringify(fallback[k]));
                        }

                        if (editMode === 'avatar') {
                            AVATAR_CFG = copy;
                            saveAvatarCfg();
                            buildAvatarRig();
                        } else {
                            CFG = copy;
                            saveCfg();
                            applyColors();
                            buildRig();
                        }
                        buildPanel();
                        showToast('ASSET LOADED');
                    } catch (err) {
                        console.error(err);
                        showToast('LOAD FAILED — SEE CONSOLE');
                    } finally {
                        e.target.value = '';
                    }
                };
                r.readAsText(f);
            });

            function parseAssetFile(text) {
                if (/window\.(PLAYER|AVATAR)_MODEL_DATA\s*=/.test(text)) {
                    const key = /AVATAR/.test(text) ? 'AVATAR_MODEL_DATA' : 'PLAYER_MODEL_DATA';
                    const fn = new Function('window', text + '; return window.' + key + ';');
                    return fn({});
                }
                const start = text.indexOf('{');
                const end = text.lastIndexOf('}');
                if (start < 0 || end <= start) throw new Error('No object literal found');
                const objText = text.slice(start, end + 1);
                return new Function('return (' + objText + ');')();
            }

            function showToast(msg) {
                const t = document.getElementById('toast');
                t.textContent = msg;
                t.classList.add('show');
                clearTimeout(showToast._t);
                showToast._t = setTimeout(() => t.classList.remove('show'), 1600);
            }

            /* ============================================================
               19. CONFIG RENDERERS
               ============================================================ */
            function renderConfigJS() {
                const hx = n => '0x' + n.toString(16).padStart(6, '0');
                return `/* ===== PLAYER_MODEL CONFIG — generated by PlayerEditor.html ===== */
window.PLAYER_MODEL_DATA = {
    colors: {
        skin:   ${hx(CFG.colors.skin)},
        pants:  ${hx(CFG.colors.pants)},
        boot:   ${hx(CFG.colors.boot)},
        sleeve: ${hx(CFG.colors.sleeve)},
    },
    body: {
        hipY: ${CFG.body.hipY}, legLen: ${CFG.body.legLen},
        legW: ${CFG.body.legW}, legD: ${CFG.body.legD},
        legSpread: ${CFG.body.legSpread},
        bootW: ${CFG.body.bootW}, bootH: ${CFG.body.bootH},
        bootD: ${CFG.body.bootD}, bootOffZ: ${CFG.body.bootOffZ},
        torsoW: ${CFG.body.torsoW}, torsoH: ${CFG.body.torsoH},
        torsoD: ${CFG.body.torsoD}, torsoY: ${CFG.body.torsoY},
        eyeX: ${CFG.body.eyeX}, eyeY: ${CFG.body.eyeY}, eyeZ: ${CFG.body.eyeZ},
    },
    hands: {
        L: { x: ${CFG.hands.L.x}, y: ${CFG.hands.L.y}, z: ${CFG.hands.L.z},
             rx: ${CFG.hands.L.rx}, ry: ${CFG.hands.L.ry}, rz: ${CFG.hands.L.rz} },
        R: { x: ${CFG.hands.R.x}, y: ${CFG.hands.R.y}, z: ${CFG.hands.R.z},
             rx: ${CFG.hands.R.rx}, ry: ${CFG.hands.R.ry}, rz: ${CFG.hands.R.rz} },
        sleeveW: ${CFG.hands.sleeveW}, sleeveH: ${CFG.hands.sleeveH},
        sleeveL: ${CFG.hands.sleeveL},
        palmW: ${CFG.hands.palmW}, palmH: ${CFG.hands.palmH},
        palmD: ${CFG.hands.palmD},
        thumbW: ${CFG.hands.thumbW}, thumbH: ${CFG.hands.thumbH},
        thumbD: ${CFG.hands.thumbD},
        thumbX: ${CFG.hands.thumbX}, thumbY: ${CFG.hands.thumbY},
        thumbZ: ${CFG.hands.thumbZ},
    },
    anim: {
        legAmpWalk: ${CFG.anim.legAmpWalk},
        legAmpSprint: ${CFG.anim.legAmpSprint},
        legSway: ${CFG.anim.legSway},
        handBob: ${CFG.anim.handBob},
        handBobX: ${CFG.anim.handBobX},
        swayStrength: ${CFG.anim.swayStrength},
        swayK: ${CFG.anim.swayK}, swayC: ${CFG.anim.swayC},
        sprintLean: ${CFG.anim.sprintLean},
        breath: ${CFG.anim.breath},
        yawFollow: ${CFG.anim.yawFollow},
        pitchFollow: ${CFG.anim.pitchFollow},
    },
};
`;
            }

            function renderAvatarConfigJS() {
                const hx = n => '0x' + n.toString(16).padStart(6, '0');
                const C = AVATAR_CFG.colors;
                const B = AVATAR_CFG.body;
                const parts = (AVATAR_CFG.parts || []).map(p =>
                    `        { p: [${p.p.join(', ')}], s: [${p.s.join(', ')}], ` +
                    `c: ${hx(p.c)}, parent: '${p.parent}' }`
                ).join(',\n');

                return `/* ===== AVATAR_MODEL CONFIG — generated by PlayerEditor.html ===== */
window.AVATAR_MODEL_DATA = {
    colors: {
        skin:   ${hx(C.skin)},
        hair:   ${hx(C.hair)},
        shirt:  ${hx(C.shirt)},
        pants:  ${hx(C.pants)},
        boot:   ${hx(C.boot)},
        accent: ${hx(C.accent)},
    },
    body: {
        hipY: ${B.hipY}, legLen: ${B.legLen},
        legW: ${B.legW}, legD: ${B.legD}, legSpread: ${B.legSpread},
        bootW: ${B.bootW}, bootH: ${B.bootH}, bootD: ${B.bootD}, bootOffZ: ${B.bootOffZ},
        torsoW: ${B.torsoW}, torsoH: ${B.torsoH}, torsoD: ${B.torsoD}, torsoY: ${B.torsoY},
        headW: ${B.headW}, headH: ${B.headH}, headD: ${B.headD}, headY: ${B.headY},
        hairW: ${B.hairW}, hairH: ${B.hairH}, hairD: ${B.hairD}, hairY: ${B.hairY},
        armW: ${B.armW}, armLen: ${B.armLen}, armSpread: ${B.armSpread}, armY: ${B.armY},
        armHandW: ${B.armHandW}, armHandH: ${B.armHandH}, armHandD: ${B.armHandD},
        armHandOffset: ${B.armHandOffset},
    },
    parts: [
${parts}
    ],
};
`;
            }

            /* ============================================================
               20. MAIN LOOP
               ============================================================ */
            buildPanel();
            applyColors();
            buildRig();
            buildAvatarRig();
            resize();
            updateFpLockHint();

            let lastTime = performance.now();
            function loop(now) {
                requestAnimationFrame(loop);
                const dt = Math.min(0.05, (now - lastTime) / 1000);
                lastTime = now;

                animate(dt);

                if (editMode === 'avatar') {
                    updateOrbitCamera();
                    renderer.render(scene, orbitCamera);
                } else if (viewMode === 'orbit') {
                    updateOrbitCamera();
                    renderer.render(scene, orbitCamera);
                } else {
                    renderer.render(scene, fpCamera);
                }
            }
            requestAnimationFrame(loop);

        })();
    </script>

</body>

</html>
