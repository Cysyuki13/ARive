<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Model Editor — Ruin City</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0d12;
            color: #dfe4ea;
            font-family: "Courier New", Courier, monospace;
            font-size: 12px;
        }

        #app {
            display: flex;
            height: 100vh;
        }

        #viewport {
            flex: 1;
            position: relative;
            background: #10141a;
            overflow: hidden;
        }

        #viewport canvas {
            display: block;
        }

        /* ---------- Toolbar ---------- */
        #toolbar {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(10, 14, 20, 0.85);
            border: 2px solid #232b36;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            font-size: 11px;
            flex-wrap: wrap;
            z-index: 10;
        }

        #toolbar button {
            font-family: inherit;
            font-size: 11px;
            padding: 5px 12px;
            letter-spacing: 1px;
            color: #b8c8d8;
            background: #141c26;
            border: 1px solid #2a3a4a;
            cursor: pointer;
        }

        #toolbar button.active {
            background: #2a3a4a;
            color: #e8c86a;
            border-color: #e8c86a;
        }

        #toolbar button:hover {
            background: #1a2530;
        }

        #toolbar .spacer {
            flex: 1;
        }

        #lockHint {
            font-size: 10px;
            color: #5a6a7a;
            letter-spacing: 0.5px;
        }

        /* ---------- Side panel ---------- */
        #panel {
            width: 420px;
            background: #0e1116;
            border-left: 2px solid #232b36;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #panel header {
            padding: 14px 18px 12px;
            border-bottom: 2px solid #232b36;
            background: #0a0d12;
        }

        #panel header h1 {
            font-size: 14px;
            letter-spacing: 4px;
            color: #e8c86a;
            text-shadow: 2px 2px 0 #05070a;
        }

        #panel header .sub {
            font-size: 10px;
            color: #5a6a7a;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        /* Tool tabs */
        #toolTabs {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 10px 14px;
            border-bottom: 2px solid #232b36;
            background: #0a0d12;
        }

        #toolTabs button {
            font-family: inherit;
            font-size: 10px;
            padding: 5px 10px;
            letter-spacing: 1px;
            color: #b8c8d8;
            background: #141c26;
            border: 1px solid #2a3a4a;
            cursor: pointer;
        }

        #toolTabs button.active {
            background: #2a3a4a;
            color: #e8c86a;
            border-color: #e8c86a;
        }

        #toolTabs button:hover {
            background: #1a2530;
        }

        #controls {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 12px;
        }

        #controls::-webkit-scrollbar {
            width: 8px;
        }

        #controls::-webkit-scrollbar-thumb {
            background: #2a3a4a;
        }

        #controls::-webkit-scrollbar-track {
            background: #0a0d12;
        }

        details {
            border-bottom: 1px solid #1a2028;
        }

        details[open] summary {
            background: #121820;
        }

        summary {
            padding: 10px 18px;
            font-size: 10px;
            letter-spacing: 3px;
            color: #6ac8e8;
            cursor: pointer;
            list-style: none;
            user-select: none;
            border-left: 3px solid transparent;
            transition: border-color .1s, background .1s;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        summary::before {
            content: "▸ ";
            color: #5a6a7a;
        }

        details[open] summary::before {
            content: "▾ ";
            color: #6ac8e8;
        }

        summary:hover {
            border-left-color: #6ac8e8;
        }

        .entry {
            display: grid;
            grid-template-columns: 100px 1fr 62px;
            gap: 8px;
            align-items: center;
            padding: 4px 18px;
        }

        .entry .lbl {
            font-size: 10px;
            color: #8a96a4;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .entry input[type="range"] {
            width: 100%;
            height: 3px;
            background: #1a2028;
            appearance: none;
            -webkit-appearance: none;
            outline: none;
            cursor: pointer;
        }

        .entry input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #6ac8e8;
            border: 1px solid #0a0d12;
            cursor: grab;
        }

        .entry input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            background: #6ac8e8;
            border: 1px solid #0a0d12;
            cursor: grab;
        }

        .entry input[type="number"] {
            width: 100%;
            font-family: inherit;
            font-size: 10px;
            padding: 3px 4px;
            background: #141c26;
            border: 1px solid #2a3a4a;
            color: #dfe4ea;
            outline: none;
            text-align: right;
        }

        .entry input[type="number"]:focus {
            border-color: #6ac8e8;
        }

        /* ---------- Color row ---------- */
        .color-row {
            padding: 6px 18px 8px;
            border-bottom: 1px solid #131820;
        }

        .color-row .color-head {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }

        .color-row .color-head .lbl {
            font-size: 10px;
            color: #8a96a4;
            letter-spacing: 0.5px;
            flex: 1;
        }

        .color-row .swatch {
            width: 26px;
            height: 14px;
            border: 1px solid #2a3a4a;
            background: #000;
        }

        .color-row .hex {
            font-size: 10px;
            color: #6ac8e8;
            letter-spacing: 1px;
        }

        .channel {
            display: grid;
            grid-template-columns: 14px 1fr 32px;
            gap: 6px;
            align-items: center;
            margin: 2px 0;
        }

        .channel .ch-name {
            font-size: 10px;
            font-weight: bold;
        }

        .channel.r .ch-name {
            color: #e05a5a;
        }

        .channel.g .ch-name {
            color: #7ad07a;
        }

        .channel.b .ch-name {
            color: #6ab8e8;
        }

        .channel input[type="range"] {
            width: 100%;
            height: 3px;
            background: #1a2028;
            appearance: none;
            -webkit-appearance: none;
            outline: none;
            cursor: pointer;
        }

        .channel input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 11px;
            height: 11px;
            background: currentColor;
            border: 1px solid #0a0d12;
        }

        .channel.r input[type="range"]::-webkit-slider-thumb {
            background: #e05a5a;
        }

        .channel.g input[type="range"]::-webkit-slider-thumb {
            background: #7ad07a;
        }

        .channel.b input[type="range"]::-webkit-slider-thumb {
            background: #6ab8e8;
        }

        .channel .ch-val {
            font-size: 10px;
            color: #b8c8d8;
            text-align: right;
        }

        /* ---------- Part list ---------- */
        .part-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding: 6px 18px 10px;
        }

        .part-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            background: #12161d;
            border: 1px solid #2a3a4a;
            cursor: pointer;
            font-size: 10px;
            letter-spacing: 0.5px;
        }

        .part-item:hover {
            background: #1a2530;
            border-color: #3a4a5a;
        }

        .part-item.sel {
            background: #1a2530;
            border-color: #e8c86a;
        }

        .part-item .part-swatch {
            width: 14px;
            height: 14px;
            border: 1px solid #0a0d12;
            flex-shrink: 0;
        }

        .part-item .part-name {
            flex: 1;
            color: #b8c8d8;
        }

        .part-item .part-size {
            color: #5a6a7a;
            font-size: 9px;
        }

        .part-item .part-glow {
            color: #e8c86a;
            font-size: 9px;
        }

        .part-item .part-rotated {
            color: #6ac8e8;
            font-size: 9px;
        }

        /* ---------- Buttons ---------- */
        .row-buttons {
            display: flex;
            gap: 6px;
            padding: 6px 18px 10px;
        }

        .row-buttons button {
            flex: 1;
            font-family: inherit;
            font-size: 10px;
            padding: 7px 8px;
            letter-spacing: 1px;
            cursor: pointer;
            border: 1px solid #2a3a4a;
            background: #141c26;
            color: #b8c8d8;
        }

        .row-buttons button:hover {
            background: #1a2530;
            color: #e8f2ff;
            border-color: #6ac8e8;
        }

        .row-buttons button.danger {
            color: #e08a8a;
            border-color: #4a2a2a;
        }

        .row-buttons button.danger:hover {
            background: #2a1418;
            border-color: #e05a5a;
        }

        .row-buttons button.primary {
            background: #e8c86a;
            color: #0b0f14;
            border-color: #f6e2a6;
            font-weight: bold;
        }

        .row-buttons button.primary:hover {
            background: #f6dd8b;
        }

        /* ---------- Quick-snap row ---------- */
        .snap-row {
            display: flex;
            gap: 4px;
            padding: 4px 18px 10px;
        }

        .snap-row button {
            flex: 1;
            font-family: inherit;
            font-size: 9px;
            padding: 5px 4px;
            letter-spacing: 1px;
            cursor: pointer;
            border: 1px solid #2a3a4a;
            background: #141c26;
            color: #8a96a4;
        }

        .snap-row button:hover {
            background: #1a2530;
            color: #e8c86a;
            border-color: #e8c86a;
        }

        /* ---------- Footer ---------- */
        #panel footer {
            padding: 12px 18px;
            border-top: 2px solid #232b36;
            background: #0a0d12;
            display: flex;
            gap: 8px;
        }

        #panel footer button {
            font-family: inherit;
            font-size: 11px;
            padding: 9px 14px;
            letter-spacing: 2px;
            cursor: pointer;
            border: 2px solid #2a3a4a;
            background: #141c26;
            color: #b8c8d8;
        }

        #panel footer button.primary {
            flex: 1;
            background: #e8c86a;
            color: #0b0f14;
            border-color: #f6e2a6;
            font-weight: bold;
        }

        #panel footer button.primary:hover {
            background: #f6dd8b;
        }

        #panel footer button:hover:not(.primary) {
            background: #1a2530;
            color: #e8f2ff;
            border-color: #6ac8e8;
        }

        #panel footer button:active {
            transform: translateY(1px);
        }

        /* ---------- Toast ---------- */
        #toast {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(60px);
            padding: 10px 20px;
            background: #e8c86a;
            color: #0b0f14;
            font-weight: bold;
            letter-spacing: 2px;
            font-size: 11px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: transform .25s cubic-bezier(.34, 1.56, .64, 1);
            pointer-events: none;
            z-index: 20;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .hint-box {
            margin: 10px 18px;
            padding: 8px 10px;
            background: #10141a;
            border-left: 2px solid #6ac8e8;
            font-size: 10px;
            line-height: 1.6;
            color: #7a8a9a;
            letter-spacing: 0.3px;
        }

        .hint-box b {
            color: #e8c86a;
        }

        .hint-box code {
            color: #6ac8e8;
            font-family: inherit;
        }
    </style>
</head>

<body>

    <div id="app">

        <div id="viewport">
            <div id="toolbar">
                <button id="viewFP" class="active">◉ FP VIEW</button>
                <button id="viewOrbit">⟳ ORBIT</button>
                <button id="testSwing">▶ TEST SWING</button>
                <span class="spacer"></span>
                <span id="lockHint">Click viewport to look · ESC to release</span>
            </div>
            <div id="toast"></div>
        </div>

        <aside id="panel">
            <header>
                <h1>TOOL MODEL</h1>
                <div class="sub">edit · preview · export</div>
            </header>
            <div id="toolTabs"></div>
            <div id="controls"></div>
            <footer>
                <button id="resetBtn">RESET TOOL</button>
                <button id="downloadBtn">⬇ SAVE ASSET</button>
                <button id="loadBtn">⬆ LOAD ASSET</button>
                <button id="copyBtn" class="primary">COPY CONFIG</button>
            </footer>

            <!-- hidden file picker for LOAD ASSET -->
            <input type="file" id="loadFile" accept=".js,.json" hidden>
        </aside>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="assets/toolModels.js"></script>
    <script>
        (function () {
            'use strict';

            const PI = Math.PI;
            const DEG = PI / 180;

            /* ============================================================
   FALLBACK — used only if assets/toolModels.js failed to load.
   Same shape as the external asset, kept in sync with the
   in-game TOOL_HELD.
   ============================================================ */
            const FALLBACK = {
                sledge: {
                    pose: { p: [0.00, -0.02, -0.05], r: [0.35, 0.10, 0.05] },
                    anim: { swing: 1.15, kick: 0.02 },
                    model: [
                        { p: [0.00, 0.00, -0.28], s: [0.045, 0.045, 0.60], c: 0x5a3a18 },
                        { p: [0.10, 0.00, -0.56], s: [0.30, 0.14, 0.09], c: 0x808890 },
                        { p: [0.24, 0.00, -0.56], s: [0.05, 0.10, 0.09], c: 0x9098a0 }
                    ]
                },
                charge: {
                    pose: { p: [0.00, -0.04, -0.06], r: [0.15, 0.10, 0.05] },
                    anim: { swing: 0.45, kick: 0.03 },
                    model: [
                        { p: [0, 0, -0.16], s: [0.18, 0.20, 0.18], c: 0xa04028 },
                        { p: [0, 0.14, -0.16], s: [0.05, 0.06, 0.05], c: 0x404040 }
                    ]
                },
                rifle: {
                    pose: { p: [0.00, -0.03, -0.08], r: [0.20, 0.05, -0.05] },
                    anim: { swing: 0.40, kick: -0.07 },
                    model: [
                        { p: [0, 0.00, -0.45], s: [0.05, 0.09, 0.90], c: 0x30353a },
                        { p: [0, -0.08, -0.10], s: [0.07, 0.14, 0.14], c: 0x4a3820 },
                        { p: [0, -0.02, 0.14], s: [0.06, 0.10, 0.22], c: 0x4a3820 },
                        { p: [0, 0.07, -0.28], s: [0.04, 0.05, 0.14], c: 0x505860 }
                    ]
                },
                flare: {
                    pose: { p: [0.00, -0.02, -0.06], r: [0.10, 0.00, 0.00] },
                    anim: { swing: 0.30, kick: 0.02 },
                    model: [
                        { p: [0, 0, -0.14], s: [0.05, 0.05, 0.26], c: 0xd0d0c0 },
                        { p: [0, 0, -0.29], s: [0.06, 0.06, 0.06], c: 0xd04020 }
                    ]
                },
                medkit: {
                    pose: { p: [0.00, -0.06, -0.08], r: [0.15, 0.08, 0.05] },
                    anim: { swing: 0.30, kick: 0.02 },
                    model: [
                        { p: [0, 0, -0.15], s: [0.20, 0.14, 0.18], c: 0xd0d0c8 },
                        { p: [0, 0, -0.06], s: [0.05, 0.10, 0.02], c: 0xc02020 },
                        { p: [0, 0, -0.06], s: [0.10, 0.05, 0.02], c: 0xc02020 }
                    ]
                },
                ration: {
                    pose: { p: [0.00, -0.05, -0.08], r: [0.25, 0.10, 0.05] },
                    anim: { swing: 0.30, kick: 0.02 },
                    model: [
                        { p: [0, 0.00, -0.12], s: [0.18, 0.09, 0.16], c: 0x6a7a4a },
                        { p: [0, 0.055, -0.12], s: [0.18, 0.02, 0.16], c: 0x4a5a2a }
                    ]
                }
            };

            /* ============================================================
               1. DEFAULTS — same data as TOOL_HELD in game.js
               Each part now supports:
                 p : position  [x, y, z]
                 s : size      [x, y, z]
                 r : rotation  [rx, ry, rz]   (radians, optional)
                 c : color     (hex)
                 e : emissive  (hex, optional — enables the glow halo)
               ============================================================ */
            const DEFAULTS = (function () {
                const src = window.TOOL_HELD_DATA;
                if (!src) return JSON.parse(JSON.stringify(FALLBACK));

                // Deep-clone so we never mutate the loaded asset.
                const copy = JSON.parse(JSON.stringify(src));

                // Ensure every tool exists and every part has an `r` array.
                for (const k of Object.keys(FALLBACK)) {
                    if (!copy[k]) {
                        copy[k] = JSON.parse(JSON.stringify(FALLBACK[k]));
                    } else {
                        for (const part of copy[k].model) {
                            if (!part.r) part.r = [0, 0, 0];
                        }
                    }
                }
                return copy;
            })();

            const TOOL_ORDER = ['sledge', 'charge', 'rifle', 'flare', 'medkit', 'ration'];
            const TOOL_NAMES = {
                sledge: 'SLEDGE', charge: 'CHARGE', rifle: 'RIFLE',
                flare: 'FLARE', medkit: 'MEDKIT', ration: 'RATION'
            };

            const STORAGE_KEY = 'ruincity-tool-editor-v1';

            // Deep-clone the defaults so we can mutate freely.
            let CFG = loadCfg() || JSON.parse(JSON.stringify(DEFAULTS));

            function loadCfg() {
                try {
                    const s = localStorage.getItem(STORAGE_KEY);
                    if (!s) return null;
                    const parsed = JSON.parse(s);
                    for (const k of TOOL_ORDER) {
                        if (!parsed[k]) {
                            parsed[k] = JSON.parse(JSON.stringify(DEFAULTS[k]));
                        } else {
                            // Make sure every part has an `r` array (older saves).
                            for (const part of parsed[k].model) {
                                if (!part.r) part.r = [0, 0, 0];
                            }
                        }
                    }
                    return parsed;
                } catch (e) { return null; }
            }
            function saveCfg() {
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(CFG)); } catch (e) { }
            }

            /* ============================================================
               2. THREE.JS SCENE
               ============================================================ */
            const viewportEl = document.getElementById('viewport');

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x10141a, 1);
            viewportEl.appendChild(renderer.domElement);

            const scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x10141a, 6, 18);

            // Lights
            scene.add(new THREE.AmbientLight(0xa8b0c0, 0.55));
            const key = new THREE.DirectionalLight(0xffe0b0, 0.85);
            key.position.set(2, 4, 2);
            scene.add(key);
            const fill = new THREE.DirectionalLight(0x8090b0, 0.35);
            fill.position.set(-2, 1, -2);
            scene.add(fill);
            const rim = new THREE.DirectionalLight(0xc0d8ff, 0.25);
            rim.position.set(0, 1, -3);
            scene.add(rim);

            // Ground grid
            const grid = new THREE.GridHelper(10, 20, 0x2a3a4a, 0x1a2028);
            grid.position.y = 0.001;
            scene.add(grid);

            const floorGeo = new THREE.PlaneGeometry(20, 20);
            const floorMat = new THREE.MeshLambertMaterial({ color: 0x14191f });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Cameras
            const fpCamera = new THREE.PerspectiveCamera(76, 1, 0.04, 200);
            fpCamera.rotation.order = 'YXZ';
            scene.add(fpCamera);

            const orbitCamera = new THREE.PerspectiveCamera(45, 1, 0.01, 200);

            /* ============================================================
               3. PLAYER RIG — mirrors game.js FP_MODEL
               ============================================================ */
            const FP_MODEL = {
                colors: {
                    skin: 0xd4a686,
                    pants: 0x2a3a4a,
                    boot: 0x18181a,
                    sleeve: 0x3a4a30,
                },
                body: {
                    hipY: 0.53, legLen: 0.42, legW: 0.12, legD: 0.15, legSpread: 0.1,
                    bootW: 0.17, bootH: 0.095, bootD: 0.24, bootOffZ: 0.04,
                    torsoW: 0.38, torsoH: 0.72, torsoD: 0.17, torsoY: 0.86,
                    eyeX: 0.01, eyeY: 1.27, eyeZ: -0.15,
                },
                hands: {
                    L: { x: -0.32, y: -0.3, z: -0.34, rx: -0.22, ry: 0, rz: 0.16 },
                    R: { x: 0.28, y: -0.28, z: -0.32, rx: -0.26, ry: 0, rz: -0.14 },
                    sleeveW: 0.11, sleeveH: 0.11, sleeveL: 0.3,
                    palmW: 0.12, palmH: 0.13, palmD: 0.14,
                    thumbW: 0.04, thumbH: 0.05, thumbD: 0.07,
                }
            };

            const SKIN_MAT = new THREE.MeshLambertMaterial({ color: FP_MODEL.colors.skin, fog: true });
            const PANTS_MAT = new THREE.MeshLambertMaterial({ color: FP_MODEL.colors.pants, fog: true });
            const BOOT_MAT = new THREE.MeshLambertMaterial({ color: FP_MODEL.colors.boot, fog: true });
            const SLEEVE_MAT = new THREE.MeshLambertMaterial({ color: FP_MODEL.colors.sleeve, fog: true });

            const playerBody = new THREE.Group();
            scene.add(playerBody);

            function buildLeg(side) {
                const pivot = new THREE.Group();
                pivot.position.set(FP_MODEL.body.legSpread * side, FP_MODEL.body.hipY, 0);

                const leg = new THREE.Mesh(
                    new THREE.BoxGeometry(FP_MODEL.body.legW, FP_MODEL.body.legLen, FP_MODEL.body.legD),
                    PANTS_MAT
                );
                leg.position.set(0, -FP_MODEL.body.legLen * 0.5, 0);
                pivot.add(leg);

                const boot = new THREE.Mesh(
                    new THREE.BoxGeometry(FP_MODEL.body.bootW, FP_MODEL.body.bootH, FP_MODEL.body.bootD),
                    BOOT_MAT
                );
                boot.position.set(
                    0,
                    -FP_MODEL.body.legLen * 0.5 - FP_MODEL.body.bootH * 0.5 - 0.01,
                    FP_MODEL.body.bootOffZ
                );
                leg.add(boot);

                return pivot;
            }

            const legLPivot = buildLeg(-1);
            const legRPivot = buildLeg(+1);
            playerBody.add(legLPivot);
            playerBody.add(legRPivot);

            const torso = new THREE.Mesh(
                new THREE.BoxGeometry(FP_MODEL.body.torsoW, FP_MODEL.body.torsoH, FP_MODEL.body.torsoD),
                PANTS_MAT
            );
            torso.position.set(0, FP_MODEL.body.torsoY, 0);
            playerBody.add(torso);

            // Hands root, parented to the FP camera
            const fpRoot = new THREE.Group();
            fpCamera.add(fpRoot);

            function buildHand(side) {
                const group = new THREE.Group();

                const sleeve = new THREE.Mesh(
                    new THREE.BoxGeometry(FP_MODEL.hands.sleeveW, FP_MODEL.hands.sleeveH, FP_MODEL.hands.sleeveL),
                    SLEEVE_MAT
                );
                sleeve.position.set(0, 0, FP_MODEL.hands.sleeveL * 0.5);
                group.add(sleeve);

                const palm = new THREE.Mesh(
                    new THREE.BoxGeometry(FP_MODEL.hands.palmW, FP_MODEL.hands.palmH, FP_MODEL.hands.palmD),
                    SKIN_MAT
                );
                palm.position.set(0, 0, -FP_MODEL.hands.palmD * 0.5);
                group.add(palm);

                const thumb = new THREE.Mesh(
                    new THREE.BoxGeometry(FP_MODEL.hands.thumbW, FP_MODEL.hands.thumbH, FP_MODEL.hands.thumbD),
                    SKIN_MAT
                );
                thumb.position.set(-0.07 * side, 0.02, -FP_MODEL.hands.palmD * 0.5);
                group.add(thumb);

                return group;
            }

            const handL = buildHand(-1);
            const handR = buildHand(+1);
            fpRoot.add(handL);
            fpRoot.add(handR);

            handL.position.set(FP_MODEL.hands.L.x, FP_MODEL.hands.L.y, FP_MODEL.hands.L.z);
            handL.rotation.set(FP_MODEL.hands.L.rx, FP_MODEL.hands.L.ry, FP_MODEL.hands.L.rz);
            handR.position.set(FP_MODEL.hands.R.x, FP_MODEL.hands.R.y, FP_MODEL.hands.R.z);
            handR.rotation.set(FP_MODEL.hands.R.rx, FP_MODEL.hands.R.ry, FP_MODEL.hands.R.rz);

            /* ============================================================
               4. TOOL HOLDER
               ============================================================ */
            let currentTool = 'sledge';
            let toolHolder = null;
            let selectedPartIdx = -1;
            let selectionBox = null;

            function disposeGroup(g) {
                g.traverse(o => {
                    if (o.geometry) o.geometry.dispose();
                    if (o.material) {
                        if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
                        else o.material.dispose();
                    }
                });
                while (g.children.length) g.remove(g.children[0]);
            }

            // Normalise a part's rotation, defaulting to [0,0,0].
            function partRot(b) {
                if (!b.r) b.r = [0, 0, 0];
                return b.r;
            }

            function buildPartGroup(b) {
                const g = new THREE.Group();
                g.position.set(b.p[0], b.p[1], b.p[2]);

                const rot = partRot(b);
                g.rotation.set(rot[0], rot[1], rot[2]);

                const matOpts = { color: b.c, fog: true };
                if (b.e) {
                    matOpts.emissive = b.e;
                    matOpts.emissiveIntensity = 1.0;
                }
                const mat = new THREE.MeshLambertMaterial(matOpts);
                const mesh = new THREE.Mesh(
                    new THREE.BoxGeometry(b.s[0], b.s[1], b.s[2]),
                    mat
                );
                g.add(mesh);

                // Glow halo — additive box slightly larger than the part.
                // Since it lives inside `g`, it inherits the part's rotation.
                if (b.e) {
                    const haloMat = new THREE.MeshBasicMaterial({
                        color: b.e,
                        transparent: true,
                        opacity: 0.35,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false,
                        fog: false
                    });
                    const halo = new THREE.Mesh(
                        new THREE.BoxGeometry(b.s[0] * 1.18, b.s[1] * 1.18, b.s[2] * 1.18),
                        haloMat
                    );
                    halo.renderOrder = 5;
                    g.add(halo);
                }

                return g;
            }

            function buildToolHolder() {
                if (toolHolder) {
                    handR.remove(toolHolder);
                    disposeGroup(toolHolder);
                }
                toolHolder = new THREE.Group();
                handR.add(toolHolder);
                rebuildToolModel();
            }

            function rebuildToolModel() {
                if (!toolHolder) return;

                // Remove previous children but keep the holder transform
                while (toolHolder.children.length) {
                    const c = toolHolder.children[0];
                    toolHolder.remove(c);
                    disposeGroup(c);
                }

                const def = CFG[currentTool];
                for (let i = 0; i < def.model.length; i++) {
                    const part = def.model[i];
                    const g = buildPartGroup(part);
                    g.userData.partIndex = i;
                    toolHolder.add(g);
                }

                // Selection highlight box — mirrors the part's transform
                if (selectionBox) {
                    toolHolder.remove(selectionBox);
                    disposeGroup(selectionBox);
                    selectionBox = null;
                }
                if (selectedPartIdx >= 0 && def.model[selectedPartIdx]) {
                    const b = def.model[selectedPartIdx];
                    const edges = new THREE.EdgesGeometry(
                        new THREE.BoxGeometry(b.s[0] * 1.06, b.s[1] * 1.06, b.s[2] * 1.06)
                    );
                    selectionBox = new THREE.LineSegments(
                        edges,
                        new THREE.LineBasicMaterial({
                            color: 0xe8c86a,
                            depthTest: false,
                            transparent: true,
                            opacity: 0.9
                        })
                    );
                    const rot = partRot(b);
                    selectionBox.position.set(b.p[0], b.p[1], b.p[2]);
                    selectionBox.rotation.set(rot[0], rot[1], rot[2]);
                    selectionBox.renderOrder = 999;
                    toolHolder.add(selectionBox);
                }

                // Apply current pose
                const pose = def.pose;
                toolHolder.position.set(pose.p[0], pose.p[1], pose.p[2]);
                toolHolder.rotation.set(pose.r[0], pose.r[1], pose.r[2]);
            }

            /* ============================================================
               5. ANIMATION
               ============================================================ */
            let toolAnimT = 1;
            let toolAnimPlaying = false;

            function triggerSwing() {
                toolAnimT = 0;
                toolAnimPlaying = true;
            }

            function updateToolAnim(dt) {
                if (toolAnimPlaying) {
                    toolAnimT = Math.min(1, toolAnimT + dt * 5.5);
                    if (toolAnimT >= 1) toolAnimPlaying = false;
                }

                if (!toolHolder) return;
                const def = CFG[currentTool];
                const bell = toolAnimT < 1 ? Math.sin(toolAnimT * Math.PI) : 0;

                toolHolder.rotation.x = def.pose.r[0] + bell * def.anim.swing;
                toolHolder.rotation.y = def.pose.r[1];
                toolHolder.rotation.z = def.pose.r[2];
                toolHolder.position.set(
                    def.pose.p[0],
                    def.pose.p[1],
                    def.pose.p[2] + bell * def.anim.kick
                );
            }

            /* ============================================================
               6. UI HELPERS
               ============================================================ */
            const controlsEl = document.getElementById('controls');
            const toolTabsEl = document.getElementById('toolTabs');

            function hexToStr(hex) {
                return '#' + (hex >>> 0).toString(16).padStart(6, '0');
            }
            function rgbToHex(r, g, b) {
                return ((r & 255) << 16) | ((g & 255) << 8) | (b & 255);
            }

            function makeRange(label, value, min, max, step, onChange, fmt) {
                const row = document.createElement('div');
                row.className = 'entry';

                const lbl = document.createElement('div');
                lbl.className = 'lbl';
                lbl.textContent = label;
                row.appendChild(lbl);

                const rng = document.createElement('input');
                rng.type = 'range';
                rng.min = min; rng.max = max; rng.step = step; rng.value = value;
                row.appendChild(rng);

                const num = document.createElement('input');
                num.type = 'number';
                num.step = step;
                num.value = (fmt ? fmt(value) : value);
                row.appendChild(num);

                const commit = (v, fromNumber) => {
                    let val = parseFloat(v);
                    if (!isFinite(val)) return;
                    if (fromNumber && fmt && fmt.parse) val = fmt.parse(v);
                    val = Math.max(min, Math.min(max, val));
                    rng.value = val;
                    num.value = (fmt ? fmt(val) : val);
                    onChange(val);
                };

                rng.addEventListener('input', () => commit(rng.value, false));
                num.addEventListener('input', () => commit(num.value, true));

                return { row, set: v => { rng.value = v; num.value = (fmt ? fmt(v) : v); } };
            }

            // Degree-aware formatting for rotation sliders.
            // Internally everything stays in radians — only the UI shows degrees.
            const degFmt = function (v) {
                return (v / DEG).toFixed(1);
            };
            degFmt.parse = function (v) {
                return parseFloat(v) * DEG;
            };

            function makeColorRow(label, hex, onChange) {
                const wrap = document.createElement('div');
                wrap.className = 'color-row';

                const head = document.createElement('div');
                head.className = 'color-head';

                const lbl = document.createElement('div');
                lbl.className = 'lbl';
                lbl.textContent = label;
                head.appendChild(lbl);

                const swatch = document.createElement('div');
                swatch.className = 'swatch';
                swatch.style.background = hexToStr(hex);
                head.appendChild(swatch);

                const hexEl = document.createElement('div');
                hexEl.className = 'hex';
                hexEl.textContent = hexToStr(hex).toUpperCase();
                head.appendChild(hexEl);

                wrap.appendChild(head);

                let rr = (hex >> 16) & 255;
                let gg = (hex >> 8) & 255;
                let bb = hex & 255;

                const emit = () => {
                    const h = rgbToHex(rr, gg, bb);
                    swatch.style.background = hexToStr(h);
                    hexEl.textContent = hexToStr(h).toUpperCase();
                    onChange(h);
                };

                function makeChannel(name, val, cls, setter) {
                    const chan = document.createElement('div');
                    chan.className = 'channel ' + cls;

                    const n = document.createElement('span');
                    n.className = 'ch-name';
                    n.textContent = name;
                    chan.appendChild(n);

                    const s = document.createElement('input');
                    s.type = 'range';
                    s.min = 0; s.max = 255; s.step = 1; s.value = val;
                    chan.appendChild(s);

                    const v = document.createElement('span');
                    v.className = 'ch-val';
                    v.textContent = val;
                    chan.appendChild(v);

                    s.addEventListener('input', () => {
                        v.textContent = s.value;
                        setter(parseInt(s.value, 10));
                    });

                    return chan;
                }

                wrap.appendChild(makeChannel('R', rr, 'r', v => { rr = v; emit(); }));
                wrap.appendChild(makeChannel('G', gg, 'g', v => { gg = v; emit(); }));
                wrap.appendChild(makeChannel('B', bb, 'b', v => { bb = v; emit(); }));

                return wrap;
            }

            function section(title, open) {
                const det = document.createElement('details');
                if (open) det.open = true;
                const sum = document.createElement('summary');
                sum.textContent = title;
                det.appendChild(sum);
                return det;
            }

            /* ============================================================
               7. PANEL BUILD
               ============================================================ */
            function buildToolTabs() {
                toolTabsEl.innerHTML = '';
                for (const key of TOOL_ORDER) {
                    const b = document.createElement('button');
                    b.textContent = TOOL_NAMES[key];
                    if (key === currentTool) b.classList.add('active');
                    b.addEventListener('click', () => {
                        currentTool = key;
                        selectedPartIdx = -1;
                        buildToolTabs();
                        buildPanel();
                        rebuildToolModel();
                    });
                    toolTabsEl.appendChild(b);
                }
            }

            // Cheap helper: does this part have any non-zero rotation?
            function isRotated(b) {
                const r = partRot(b);
                return Math.abs(r[0]) > 1e-4 || Math.abs(r[1]) > 1e-4 || Math.abs(r[2]) > 1e-4;
            }

            function buildPanel() {
                controlsEl.innerHTML = '';
                const def = CFG[currentTool];

                /* ---------- TOOL POSE ---------- */
                {
                    const sec = section('TOOL POSE (in hand)', true);
                    sec.appendChild(makeRange('Pos X', def.pose.p[0], -0.5, 0.5, 0.005, v => {
                        def.pose.p[0] = v; applyPose(); saveCfg();
                    }).row);
                    sec.appendChild(makeRange('Pos Y', def.pose.p[1], -0.5, 0.5, 0.005, v => {
                        def.pose.p[1] = v; applyPose(); saveCfg();
                    }).row);
                    sec.appendChild(makeRange('Pos Z', def.pose.p[2], -0.6, 0.3, 0.005, v => {
                        def.pose.p[2] = v; applyPose(); saveCfg();
                    }).row);
                    sec.appendChild(makeRange('Rot X', def.pose.r[0], -1.6, 1.6, 0.01, v => {
                        def.pose.r[0] = v; applyPose(); saveCfg();
                    }).row);
                    sec.appendChild(makeRange('Rot Y', def.pose.r[1], -1.6, 1.6, 0.01, v => {
                        def.pose.r[1] = v; applyPose(); saveCfg();
                    }).row);
                    sec.appendChild(makeRange('Rot Z', def.pose.r[2], -1.6, 1.6, 0.01, v => {
                        def.pose.r[2] = v; applyPose(); saveCfg();
                    }).row);
                    controlsEl.appendChild(sec);
                }

                /* ---------- TOOL ANIMATION ---------- */
                {
                    const sec = section('TOOL ANIMATION', true);
                    sec.appendChild(makeRange('Swing', def.anim.swing, -2.0, 2.5, 0.01, v => {
                        def.anim.swing = v; saveCfg();
                    }).row);
                    sec.appendChild(makeRange('Kick', def.anim.kick, -0.30, 0.30, 0.005, v => {
                        def.anim.kick = v; saveCfg();
                    }).row);
                    controlsEl.appendChild(sec);
                }

                /* ---------- PARTS LIST ---------- */
                {
                    const sec = section('PARTS (' + def.model.length + ')', true);

                    const list = document.createElement('div');
                    list.className = 'part-list';

                    for (let i = 0; i < def.model.length; i++) {
                        const part = def.model[i];
                        const item = document.createElement('div');
                        item.className = 'part-item';
                        if (i === selectedPartIdx) item.classList.add('sel');

                        const sw = document.createElement('div');
                        sw.className = 'part-swatch';
                        sw.style.background = hexToStr(part.c);
                        item.appendChild(sw);

                        const nm = document.createElement('div');
                        nm.className = 'part-name';
                        nm.textContent = 'Part ' + (i + 1);
                        item.appendChild(nm);

                        if (isRotated(part)) {
                            const rot = document.createElement('div');
                            rot.className = 'part-rotated';
                            rot.textContent = '↻';
                            item.appendChild(rot);
                        }

                        const sz = document.createElement('div');
                        sz.className = 'part-size';
                        sz.textContent = part.s[0].toFixed(2) + '×' +
                            part.s[1].toFixed(2) + '×' + part.s[2].toFixed(2);
                        item.appendChild(sz);

                        if (part.e) {
                            const gl = document.createElement('div');
                            gl.className = 'part-glow';
                            gl.textContent = '✦GLOW';
                            item.appendChild(gl);
                        }

                        item.addEventListener('click', () => {
                            selectedPartIdx = i;
                            buildPanel();
                            rebuildToolModel();
                        });

                        list.appendChild(item);
                    }

                    sec.appendChild(list);

                    const btnRow = document.createElement('div');
                    btnRow.className = 'row-buttons';

                    const addBtn = document.createElement('button');
                    addBtn.className = 'primary';
                    addBtn.textContent = '+ ADD PART';
                    addBtn.addEventListener('click', () => {
                        const newPart = {
                            p: [0, 0, -0.15],
                            s: [0.1, 0.1, 0.1],
                            r: [0, 0, 0],
                            c: 0x808890
                        };
                        def.model.push(newPart);
                        selectedPartIdx = def.model.length - 1;
                        buildPanel();
                        rebuildToolModel();
                        saveCfg();
                    });
                    btnRow.appendChild(addBtn);

                    const delBtn = document.createElement('button');
                    delBtn.className = 'danger';
                    delBtn.textContent = 'DELETE';
                    delBtn.disabled = selectedPartIdx < 0 || def.model.length <= 1;
                    delBtn.style.opacity = delBtn.disabled ? 0.4 : 1;
                    delBtn.addEventListener('click', () => {
                        if (selectedPartIdx < 0 || def.model.length <= 1) return;
                        def.model.splice(selectedPartIdx, 1);
                        if (selectedPartIdx >= def.model.length) selectedPartIdx = def.model.length - 1;
                        buildPanel();
                        rebuildToolModel();
                        saveCfg();
                    });
                    btnRow.appendChild(delBtn);

                    sec.appendChild(btnRow);
                    controlsEl.appendChild(sec);
                }

                /* ---------- SELECTED PART ---------- */
                if (selectedPartIdx >= 0 && def.model[selectedPartIdx]) {
                    const part = def.model[selectedPartIdx];
                    const rot = partRot(part);

                    // --- position ---
                    const posSec = section('PART ' + (selectedPartIdx + 1) + ' — POSITION', true);
                    posSec.appendChild(makeRange('Pos X', part.p[0], -0.6, 0.6, 0.005, v => {
                        part.p[0] = v; rebuildToolModel(); saveCfg();
                    }).row);
                    posSec.appendChild(makeRange('Pos Y', part.p[1], -0.6, 0.6, 0.005, v => {
                        part.p[1] = v; rebuildToolModel(); saveCfg();
                    }).row);
                    posSec.appendChild(makeRange('Pos Z', part.p[2], -0.9, 0.3, 0.005, v => {
                        part.p[2] = v; rebuildToolModel(); saveCfg();
                    }).row);
                    controlsEl.appendChild(posSec);

                    // --- size ---
                    const sizeSec = section('SIZE', true);
                    sizeSec.appendChild(makeRange('Size X', part.s[0], 0.005, 1.5, 0.005, v => {
                        part.s[0] = v; rebuildToolModel(); saveCfg();
                    }).row);
                    sizeSec.appendChild(makeRange('Size Y', part.s[1], 0.005, 1.5, 0.005, v => {
                        part.s[1] = v; rebuildToolModel(); saveCfg();
                    }).row);
                    sizeSec.appendChild(makeRange('Size Z', part.s[2], 0.005, 1.5, 0.005, v => {
                        part.s[2] = v; rebuildToolModel(); saveCfg();
                    }).row);
                    controlsEl.appendChild(sizeSec);

                    // --- rotation (3D) ---
                    const rotSec = section('ROTATION (°)', true);
                    rotSec.appendChild(makeRange('Rot X', rot[0], -PI, PI, 1 * DEG, v => {
                        part.r[0] = v; rebuildToolModel(); saveCfg();
                    }, degFmt).row);
                    rotSec.appendChild(makeRange('Rot Y', rot[1], -PI, PI, 1 * DEG, v => {
                        part.r[1] = v; rebuildToolModel(); saveCfg();
                    }, degFmt).row);
                    rotSec.appendChild(makeRange('Rot Z', rot[2], -PI, PI, 1 * DEG, v => {
                        part.r[2] = v; rebuildToolModel(); saveCfg();
                    }, degFmt).row);

                    // Quick-snap buttons
                    const snapRow = document.createElement('div');
                    snapRow.className = 'snap-row';

                    const snaps = [
                        { label: '0°', v: 0 },
                        { label: '90°', v: PI / 2 },
                        { label: '180°', v: PI },
                        { label: '270°', v: -PI / 2 },
                    ];
                    for (const s of snaps) {
                        const b = document.createElement('button');
                        b.textContent = s.label;
                        b.title = 'Snap all three axes to ' + s.label;
                        b.addEventListener('click', () => {
                            part.r[0] = s.v;
                            part.r[1] = s.v;
                            part.r[2] = s.v;
                            rebuildToolModel();
                            buildPanel();
                            saveCfg();
                        });
                        snapRow.appendChild(b);
                    }
                    rotSec.appendChild(snapRow);

                    // Reset-rotation button
                    const resetRow = document.createElement('div');
                    resetRow.className = 'row-buttons';
                    const resetRotBtn = document.createElement('button');
                    resetRotBtn.textContent = '⟲ CLEAR ROTATION';
                    resetRotBtn.addEventListener('click', () => {
                        part.r = [0, 0, 0];
                        rebuildToolModel();
                        buildPanel();
                        saveCfg();
                    });
                    resetRow.appendChild(resetRotBtn);
                    rotSec.appendChild(resetRow);

                    controlsEl.appendChild(rotSec);

                    // --- base color ---
                    const colorSec = section('BASE COLOR', true);
                    colorSec.appendChild(makeColorRow('Base', part.c, h => {
                        part.c = h; rebuildToolModel(); saveCfg();
                    }));
                    controlsEl.appendChild(colorSec);

                    // --- glow ---
                    const glowSec = section('GLOW', true);
                    const glowOn = !!part.e;
                    const glowHex = part.e || 0xffaa33;

                    const glowHeader = document.createElement('div');
                    glowHeader.className = 'color-row';
                    glowHeader.style.paddingBottom = '4px';

                    const toggleRow = document.createElement('div');
                    toggleRow.style.display = 'flex';
                    toggleRow.style.alignItems = 'center';
                    toggleRow.style.gap = '8px';

                    const chk = document.createElement('input');
                    chk.type = 'checkbox';
                    chk.checked = glowOn;
                    toggleRow.appendChild(chk);

                    const tlbl = document.createElement('div');
                    tlbl.className = 'lbl';
                    tlbl.style.fontSize = '10px';
                    tlbl.style.color = '#8a96a4';
                    tlbl.textContent = 'Enable glow';
                    toggleRow.appendChild(tlbl);

                    glowHeader.appendChild(toggleRow);
                    glowSec.appendChild(glowHeader);

                    chk.addEventListener('change', () => {
                        if (chk.checked) {
                            part.e = glowHex || 0xffaa33;
                        } else {
                            delete part.e;
                        }
                        buildPanel();
                        rebuildToolModel();
                        saveCfg();
                    });

                    if (glowOn) {
                        glowSec.appendChild(makeColorRow('Glow', part.e, h => {
                            if (h === 0) h = 1; // keep glow enabled
                            part.e = h; rebuildToolModel(); saveCfg();
                        }));
                    }

                    controlsEl.appendChild(glowSec);
                }

                /* ---------- HINT ---------- */
                const hint = document.createElement('div');
                hint.className = 'hint-box';
                hint.innerHTML =
                    '<b>ROTATION</b>: each part can spin freely on all three axes. ' +
                    'The export writes an <code>r: [rx, ry, rz]</code> field (radians) ' +
                    'on any part whose rotation is non-zero.<br><br>' +
                    '<b>GLOW</b>: parts with a glow color export an extra <code>e</code> ' +
                    'property. To render the glow in-game, update <code>buildItemMesh()</code> in ' +
                    '<code>game.js</code> so it reads <code>b.e</code> into <code>emissive</code>.';
                controlsEl.appendChild(hint);
            }

            function applyPose() {
                if (!toolHolder) return;
                const def = CFG[currentTool];
                toolHolder.position.set(def.pose.p[0], def.pose.p[1], def.pose.p[2]);
                toolHolder.rotation.set(def.pose.r[0], def.pose.r[1], def.pose.r[2]);
            }

            /* ============================================================
               8. VIEW MODE + CONTROLS
               ============================================================ */
            let viewMode = 'fp';
            const viewFPBtn = document.getElementById('viewFP');
            const viewOrbitBtn = document.getElementById('viewOrbit');

            // FP look
            let fpYaw = 0, fpPitch = 0;
            let fpLocked = false;

            // Orbit
            let orbitYaw = 0.65, orbitPitch = 0.30, orbitDist = 1.2;
            let orbitDragging = false;
            let lastMX = 0, lastMY = 0;

            function setView(v) {
                if (viewMode === v) return;
                viewMode = v;

                if (v !== 'fp' && document.pointerLockElement === renderer.domElement) {
                    document.exitPointerLock();
                }
                if (v === 'fp') { fpYaw = 0; fpPitch = 0; }

                viewFPBtn.classList.toggle('active', v === 'fp');
                viewOrbitBtn.classList.toggle('active', v === 'orbit');
                updateLockHint();
            }

            function updateLockHint() {
                const el = document.getElementById('lockHint');
                if (viewMode === 'fp') {
                    el.textContent = fpLocked ? 'Mouse look active · ESC to release' : 'Click viewport to look';
                    el.style.color = fpLocked ? '#7ad07a' : '#5a6a7a';
                } else {
                    el.textContent = 'Drag to orbit · wheel to zoom';
                    el.style.color = '#5a6a7a';
                }
            }

            viewFPBtn.addEventListener('click', () => setView('fp'));
            viewOrbitBtn.addEventListener('click', () => setView('orbit'));
            document.getElementById('testSwing').addEventListener('click', triggerSwing);

            renderer.domElement.addEventListener('click', () => {
                if (viewMode !== 'fp') return;
                if (!fpLocked) renderer.domElement.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                fpLocked = (document.pointerLockElement === renderer.domElement);
                updateLockHint();
            });

            document.addEventListener('mousemove', (e) => {
                if (fpLocked) {
                    const s = 0.0020;
                    fpYaw -= e.movementX * s;
                    fpPitch -= e.movementY * s;
                    fpPitch = Math.max(-1.5, Math.min(1.5, fpPitch));
                    return;
                }
                if (!orbitDragging) return;
                orbitYaw -= (e.clientX - lastMX) * 0.008;
                orbitPitch += (e.clientY - lastMY) * 0.008;
                orbitPitch = Math.max(-1.3, Math.min(1.3, orbitPitch));
                lastMX = e.clientX;
                lastMY = e.clientY;
            });

            renderer.domElement.addEventListener('mousedown', (e) => {
                if (viewMode !== 'orbit') return;
                orbitDragging = true;
                lastMX = e.clientX;
                lastMY = e.clientY;
            });
            window.addEventListener('mouseup', () => orbitDragging = false);

            renderer.domElement.addEventListener('wheel', e => {
                if (viewMode !== 'orbit') return;
                e.preventDefault();
                orbitDist *= (e.deltaY > 0 ? 1.1 : 0.9);
                orbitDist = Math.max(0.3, Math.min(8, orbitDist));
            }, { passive: false });

            function updateOrbitCamera() {
                // Focus on the tool holder — it's around handR + pose offset.
                const targetX = FP_MODEL.hands.R.x + CFG[currentTool].pose.p[0];
                const targetY = FP_MODEL.hands.R.y + CFG[currentTool].pose.p[1];
                const targetZ = FP_MODEL.hands.R.z + CFG[currentTool].pose.p[2];

                const cx = targetX + Math.sin(orbitYaw) * Math.cos(orbitPitch) * orbitDist;
                const cy = targetY + Math.sin(orbitPitch) * orbitDist;
                const cz = targetZ + Math.cos(orbitYaw) * Math.cos(orbitPitch) * orbitDist;

                orbitCamera.position.set(cx, cy, cz);
                orbitCamera.lookAt(targetX, targetY, targetZ);
            }

            /* ============================================================
               9. RESIZE
               ============================================================ */
            function resize() {
                const w = viewportEl.clientWidth;
                const h = viewportEl.clientHeight;
                renderer.setSize(w, h, false);
                fpCamera.aspect = w / h;
                fpCamera.updateProjectionMatrix();
                orbitCamera.aspect = w / h;
                orbitCamera.updateProjectionMatrix();
            }
            window.addEventListener('resize', resize);

            /* ============================================================
               10. TOAST + ACTIONS
               ============================================================ */
            function showToast(msg) {
                const t = document.getElementById('toast');
                t.textContent = msg;
                t.classList.add('show');
                clearTimeout(showToast._t);
                showToast._t = setTimeout(() => t.classList.remove('show'), 1600);
            }

            document.getElementById('resetBtn').addEventListener('click', () => {
                if (!confirm('Reset "' + TOOL_NAMES[currentTool] + '" to defaults?')) return;
                CFG[currentTool] = JSON.parse(JSON.stringify(DEFAULTS[currentTool]));
                selectedPartIdx = -1;
                buildPanel();
                rebuildToolModel();
                saveCfg();
                showToast('TOOL RESET');
            });

            document.getElementById('copyBtn').addEventListener('click', () => {
                const txt = renderConfigJS();
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(txt).then(
                        () => showToast('CONFIG COPIED'),
                        () => { console.log(txt); showToast('COPY FAILED — SEE CONSOLE'); }
                    );
                } else {
                    console.log(txt);
                    showToast('COPIED TO CONSOLE');
                }
            });

            /* ---------- SAVE ASSET — download assets/toolModels.js ---------- */
            document.getElementById('downloadBtn').addEventListener('click', () => {
                // Produce a complete, drop-in assets/toolModels.js
                const body = renderConfigJS()
                    .replace(/\/\* =+ TOOL_HELD CONFIG[\s\S]*?\*\//, '')   // strip "paste into game.js" header
                    .replace(/const TOOL_HELD =/, 'window.TOOL_HELD_DATA =');

                const file =
                    '/* =========================================================================\n' +
                    '   RUIN CITY — TOOL_HELD external model data\n' +
                    '   -------------------------------------------------------------------------\n' +
                    '   Loaded by index.html (before game.js) and toolEditor.html.\n' +
                    '   Generated by toolEditor.html — overwrite assets/toolModels.js with this.\n' +
                    '   ========================================================================= */\n' +
                    body;

                const blob = new Blob([file], { type: 'text/javascript' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'toolModels.js';
                a.click();
                URL.revokeObjectURL(url);
                showToast('SAVED — REPLACE assets/toolModels.js');
            });

            /* ---------- LOAD ASSET — pull a saved toolModels.js back in ---------- */
            document.getElementById('loadBtn').addEventListener('click', () => {
                document.getElementById('loadFile').click();
            });

            document.getElementById('loadFile').addEventListener('change', (e) => {
                const f = e.target.files && e.target.files[0];
                if (!f) return;

                const r = new FileReader();
                r.onload = () => {
                    try {
                        const data = parseAssetFile(r.result);
                        if (!data || typeof data !== 'object') throw new Error('No TOOL_HELD data found');

                        // Deep-clone so we don't hold a reference to the parsed object.
                        CFG = JSON.parse(JSON.stringify(data));

                        // Backfill any tools or rotations the file might be missing.
                        for (const k of TOOL_ORDER) {
                            if (!CFG[k]) {
                                CFG[k] = JSON.parse(JSON.stringify(DEFAULTS[k]));
                            } else {
                                for (const part of CFG[k].model) {
                                    if (!part.r) part.r = [0, 0, 0];
                                }
                            }
                        }

                        selectedPartIdx = -1;
                        buildToolTabs();
                        buildPanel();
                        rebuildToolModel();
                        saveCfg();
                        showToast('ASSET LOADED');
                    } catch (err) {
                        console.error(err);
                        showToast('LOAD FAILED — SEE CONSOLE');
                    } finally {
                        // Reset the input so selecting the same file twice still fires `change`.
                        e.target.value = '';
                    }
                };
                r.readAsText(f);
            });

            /* ---------- Asset file parser ----------
               Accepts two formats:
                 · A generated asset:  window.TOOL_HELD_DATA = { ... };
                 · A raw paste of the old in-game const:  const TOOL_HELD = { ... };
               Both are evaluated in an isolated scope, so nothing leaks into the page. */
            function parseAssetFile(text) {
                // Case 1: window.TOOL_HELD_DATA = {...}
                if (/window\.TOOL_HELD_DATA\s*=/.test(text)) {
                    const fn = new Function('window', text + '; return window.TOOL_HELD_DATA;');
                    return fn({});
                }

                // Case 2: const TOOL_HELD = {...}  (or a bare object literal)
                const start = text.indexOf('{');
                const end = text.lastIndexOf('}');
                if (start < 0 || end <= start) throw new Error('No object literal found');
                const objText = text.slice(start, end + 1);
                return new Function('return (' + objText + ');')();
            }

            /* ============================================================
               11. EXPORT — produces a paste-ready TOOL_HELD block
               ============================================================ */
            function renderConfigJS() {
                const hex = n => '0x' + (n >>> 0).toString(16).padStart(6, '0');
                const fmt = n => {
                    const s = n.toFixed(4).replace(/0+$/, '').replace(/\.$/, '.0');
                    return s.includes('.') ? s : s + '.0';
                };

                let out = '';
                out += '/* ===== TOOL_HELD CONFIG — generated by tool-editor.html ===== */\n';
                out += '/* Paste this into game.js, replacing the existing TOOL_HELD object. */\n';
                out += '/* Parts may include:                                                */\n';
                out += '/*   r: [rx, ry, rz]  — rotation in radians (only if non-zero)       */\n';
                out += '/*   e: 0xRRGGBB      — emissive/glow colour (only if enabled)       */\n';
                out += '/*                                                                   */\n';
                out += '/* To render both in-game, update buildItemMesh() in game.js:         */\n';
                out += '/*   const matOpts = { color: b.c, fog: true };                      */\n';
                out += '/*   if (b.e) { matOpts.emissive = b.e;                              */\n';
                out += '/*              matOpts.emissiveIntensity = 1; }                     */\n';
                out += '/*   const mat = new THREE.MeshLambertMaterial(matOpts);             */\n';
                out += '/*   const m = new THREE.Mesh(geo, mat);                             */\n';
                out += '/*   if (b.r) m.rotation.set(b.r[0], b.r[1], b.r[2]);                */\n\n';
                out += 'const TOOL_HELD = {\n';

                for (let ti = 0; ti < TOOL_ORDER.length; ti++) {
                    const key = TOOL_ORDER[ti];
                    const def = CFG[key];
                    const comma = ti < TOOL_ORDER.length - 1 ? ',' : '';

                    out += '    ' + key + ': {\n';
                    out += '        pose: { p: [' +
                        fmt(def.pose.p[0]) + ', ' +
                        fmt(def.pose.p[1]) + ', ' +
                        fmt(def.pose.p[2]) + '], r: [' +
                        fmt(def.pose.r[0]) + ', ' +
                        fmt(def.pose.r[1]) + ', ' +
                        fmt(def.pose.r[2]) + '] },\n';
                    out += '        anim: { swing: ' + fmt(def.anim.swing) +
                        ', kick: ' + fmt(def.anim.kick) + ' },\n';
                    out += '        model: [\n';

                    for (let pi = 0; pi < def.model.length; pi++) {
                        const b = def.model[pi];
                        const pcomma = pi < def.model.length - 1 ? ',' : '';

                        let line = '            { p: [' +
                            fmt(b.p[0]) + ', ' + fmt(b.p[1]) + ', ' + fmt(b.p[2]) + '], ' +
                            's: [' +
                            fmt(b.s[0]) + ', ' + fmt(b.s[1]) + ', ' + fmt(b.s[2]) + '], ';

                        // Only include rotation when it isn't [0,0,0]
                        const r = partRot(b);
                        if (Math.abs(r[0]) > 1e-4 || Math.abs(r[1]) > 1e-4 || Math.abs(r[2]) > 1e-4) {
                            line += 'r: [' +
                                fmt(r[0]) + ', ' + fmt(r[1]) + ', ' + fmt(r[2]) + '], ';
                        }

                        line += 'c: ' + hex(b.c);
                        if (b.e) line += ', e: ' + hex(b.e);
                        line += ' }' + pcomma + '\n';
                        out += line;
                    }

                    out += '        ]\n';
                    out += '    }' + comma + '\n';
                }

                out += '};\n';
                return out;
            }

            /* ============================================================
               12. BUILD + MAIN LOOP
               ============================================================ */
            buildToolTabs();
            buildPanel();
            buildToolHolder();
            resize();
            updateLockHint();

            // Start in a mild idle pose so the first frame isn't empty
            fpCamera.position.set(FP_MODEL.body.eyeX, FP_MODEL.body.eyeY, FP_MODEL.body.eyeZ);

            let lastTime = performance.now();
            function loop(now) {
                requestAnimationFrame(loop);
                const dt = Math.min(0.05, (now - lastTime) / 1000);
                lastTime = now;

                // Idle breathing bob so the view feels alive
                const t = now * 0.001;
                const breath = Math.sin(t * 1.4) * 0.004;
                const bobY = Math.sin(t * 3.2) * 0.004;

                // FP camera
                fpCamera.position.set(
                    FP_MODEL.body.eyeX,
                    FP_MODEL.body.eyeY + bobY + breath,
                    FP_MODEL.body.eyeZ
                );

                if (viewMode === 'fp') {
                    fpCamera.rotation.set(fpPitch, fpYaw, 0);
                } else {
                    fpCamera.rotation.set(0, 0, 0);
                }

                updateToolAnim(dt);

                if (viewMode === 'orbit') {
                    updateOrbitCamera();
                    renderer.render(scene, orbitCamera);
                } else {
                    renderer.render(scene, fpCamera);
                }
            }
            requestAnimationFrame(loop);

        })();
    </script>

</body>

</html>
