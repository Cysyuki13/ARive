                    tlbl.style.fontSize = '10px';
                    tlbl.style.color = '#8a96a4';
                    tlbl.textContent = 'Enable glow';
                    toggleRow.appendChild(tlbl);

                    glowHeader.appendChild(toggleRow);
                    glowSec.appendChild(glowHeader);

                    chk.addEventListener('change', () => {
                        if (chk.checked) {
                            part.e = glowHex || 0xffaa33;
                        } else {
                            delete part.e;
                        }
                        buildPanel();
                        rebuildItemModel();
                        saveCfg();
                    });

                    if (glowOn) {
                        glowSec.appendChild(makeColorRow('Glow', part.e, h => {
                            if (h === 0) h = 1; // keep glow enabled
                            part.e = h; rebuildItemModel(); saveCfg();
                        }));
                    }

                    controlsEl.appendChild(glowSec);
                }

                /* ---------- HINT ---------- */
                const hint = document.createElement('div');
                hint.className = 'hint-box';
                hint.innerHTML =
                    '<b>BAG ICON</b>: the preview bottom-right uses the exact camera + lights ' +
                    'from <code>renderItemThumbnail()</code> in <code>game.js</code>, so what you ' +
                    'see is what the inventory tile will show.<br><br>' +
                    '<b>ROTATION</b>: parts spin freely on all three axes. The export writes an ' +
                    '<code>r: [rx, ry, rz]</code> field (radians) on any part whose rotation is ' +
                    'non-zero.<br><br>' +
                    '<b>GLOW</b>: parts with a glow colour export an extra <code>e</code> property. ' +
                    '<code>buildItemMesh()</code> in <code>game.js</code> already reads both ' +
                    '<code>b.r</code> and <code>b.e</code>, so nothing else needs changing.';
                controlsEl.appendChild(hint);
            }

            // '#rrggbb' → 0xrrggbb
            function cssHexToNum(s) {
                if (typeof s !== 'string') return s >>> 0;
                return parseInt(s.replace('#', ''), 16) >>> 0;
            }

            /* ============================================================
               8. VIEW MODE + CONTROLS
               ============================================================ */
            let viewMode = 'fp';
            const viewFPBtn = document.getElementById('viewFP');
            const viewOrbitBtn = document.getElementById('viewOrbit');
            const spinBtn = document.getElementById('spinBtn');

            let fpYaw = 0, fpPitch = 0;
            let fpLocked = false;

            let orbitYaw = 0.65, orbitPitch = 0.30, orbitDist = 1.1;
            let orbitDragging = false;
            let lastMX = 0, lastMY = 0;

            function setView(v) {
                if (viewMode === v) return;
                viewMode = v;

                if (v !== 'fp' && document.pointerLockElement === renderer.domElement) {
                    document.exitPointerLock();
                }
                if (v === 'fp') { fpYaw = 0; fpPitch = 0; }

                viewFPBtn.classList.toggle('active', v === 'fp');
                viewOrbitBtn.classList.toggle('active', v === 'orbit');
                updateLockHint();
            }

            function updateLockHint() {
                const el = document.getElementById('lockHint');
                if (viewMode === 'fp') {
                    el.textContent = fpLocked ? 'Mouse look active · ESC to release' : 'Click viewport to look';
                    el.style.color = fpLocked ? '#7ad07a' : '#5a6a7a';
                } else {
                    el.textContent = 'Drag to orbit · wheel to zoom';
                    el.style.color = '#5a6a7a';
                }
            }

            viewFPBtn.addEventListener('click', () => setView('fp'));
            viewOrbitBtn.addEventListener('click', () => setView('orbit'));
            spinBtn.addEventListener('click', () => {
                autoSpin = !autoSpin;
                spinBtn.classList.toggle('active', autoSpin);
            });

            renderer.domElement.addEventListener('click', () => {
                if (viewMode !== 'fp') return;
                if (!fpLocked) renderer.domElement.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                fpLocked = (document.pointerLockElement === renderer.domElement);
                updateLockHint();
            });

            document.addEventListener('mousemove', (e) => {
                if (fpLocked) {
                    const s = 0.0020;
                    fpYaw -= e.movementX * s;
                    fpPitch -= e.movementY * s;
                    fpPitch = Math.max(-1.5, Math.min(1.5, fpPitch));
                    return;
                }
                if (!orbitDragging) return;
                orbitYaw -= (e.clientX - lastMX) * 0.008;
                orbitPitch += (e.clientY - lastMY) * 0.008;
                orbitPitch = Math.max(-1.3, Math.min(1.3, orbitPitch));
                lastMX = e.clientX;
                lastMY = e.clientY;
            });

            renderer.domElement.addEventListener('mousedown', (e) => {
                if (viewMode !== 'orbit') return;
                orbitDragging = true;
                lastMX = e.clientX;
                lastMY = e.clientY;
            });
            window.addEventListener('mouseup', () => orbitDragging = false);

            renderer.domElement.addEventListener('wheel', e => {
                if (viewMode !== 'orbit') return;
                e.preventDefault();
                orbitDist *= (e.deltaY > 0 ? 1.1 : 0.9);
                orbitDist = Math.max(0.25, Math.min(8, orbitDist));
            }, { passive: false });

            function modelCentre(model) {
                let mnX = Infinity, mnY = Infinity, mnZ = Infinity;
                let mxX = -Infinity, mxY = -Infinity, mxZ = -Infinity;
                for (const b of model) {
                    if (b.p[0] - b.s[0] * 0.5 < mnX) mnX = b.p[0] - b.s[0] * 0.5;
                    if (b.p[0] + b.s[0] * 0.5 > mxX) mxX = b.p[0] + b.s[0] * 0.5;
                    if (b.p[1] - b.s[1] * 0.5 < mnY) mnY = b.p[1] - b.s[1] * 0.5;
                    if (b.p[1] + b.s[1] * 0.5 > mxY) mxY = b.p[1] + b.s[1] * 0.5;
                    if (b.p[2] - b.s[2] * 0.5 < mnZ) mnZ = b.p[2] - b.s[2] * 0.5;
                    if (b.p[2] + b.s[2] * 0.5 > mxZ) mxZ = b.p[2] + b.s[2] * 0.5;
                }
                return {
                    x: (mnX + mxX) * 0.5,
                    y: (mnY + mxY) * 0.5,
                    z: (mnZ + mxZ) * 0.5
                };
            }

            /* Raw AABB extents of a model, in model space. */
            function modelSize(model) {
                let mnX = Infinity, mnY = Infinity, mnZ = Infinity;
                let mxX = -Infinity, mxY = -Infinity, mxZ = -Infinity;
                for (const b of model) {
                    const hx = b.s[0] * 0.5, hy = b.s[1] * 0.5, hz = b.s[2] * 0.5;
                    if (b.p[0] - hx < mnX) mnX = b.p[0] - hx;
                    if (b.p[0] + hx > mxX) mxX = b.p[0] + hx;
                    if (b.p[1] - hy < mnY) mnY = b.p[1] - hy;
                    if (b.p[1] + hy > mxY) mxY = b.p[1] + hy;
                    if (b.p[2] - hz < mnZ) mnZ = b.p[2] - hz;
                    if (b.p[2] + hz > mxZ) mxZ = b.p[2] + hz;
                }
                return { x: mxX - mnX, y: mxY - mnY, z: mxZ - mnZ };
            }

            /* Decide whether the icon should auto-rotate the model 90° on
               Z.  The rule is symmetric and depends purely on shape:
                 · wide tile (aspect > 1.1)  + tall model (modelAspect < 0.9) → rotate
                 · tall tile (aspect < 0.9)  + wide model (modelAspect > 1.1) → rotate
               Everything else → no rotation (e.g. the rifle is already wide,
               the medkit is square, the water bottle in a 1×2 slot is
               already tall). */
            function autoIconRotZ(model, tileAspect) {
                const s = modelSize(model);
                if (s.y < 1e-4) return 0;
                const modelAspect = s.x / s.y;
                if (tileAspect > 1.1 && modelAspect < 0.9) return Math.PI / 2;
                if (tileAspect < 0.9 && modelAspect > 1.1) return Math.PI / 2;
                return 0;
            }

            function updateOrbitCamera() {
                const def = CFG[currentIdx];
                const c = modelCentre(def.model);

                // In orbit mode fpCamera sits at the eye with zero rotation, so
                // the item holder's world position is simply eye + HAND_OFFSET.
                const tx = PM.body.eyeX + HAND_OFFSET.x + c.x;
                const ty = PM.body.eyeY + HAND_OFFSET.y + c.y;
                const tz = PM.body.eyeZ + HAND_OFFSET.z + c.z;

                const cx = tx + Math.sin(orbitYaw) * Math.cos(orbitPitch) * orbitDist;
                const cy = ty + Math.sin(orbitPitch) * orbitDist;
                const cz = tz + Math.cos(orbitYaw) * Math.cos(orbitPitch) * orbitDist;

                orbitCamera.position.set(cx, cy, cz);
                orbitCamera.lookAt(tx, ty, tz);
            }

            /* ============================================================
               9. RESIZE
               ============================================================ */
            function resize() {
                const w = viewportEl.clientWidth;
                const h = viewportEl.clientHeight;
                renderer.setSize(w, h, false);
                fpCamera.aspect = w / h;
                fpCamera.updateProjectionMatrix();
                orbitCamera.aspect = w / h;
                orbitCamera.updateProjectionMatrix();
            }
            window.addEventListener('resize', resize);

            /* ============================================================
               10. TOAST + ACTIONS
               ============================================================ */
            function showToast(msg) {
                const t = document.getElementById('toast');
                t.textContent = msg;
                t.classList.add('show');
                clearTimeout(showToast._t);
                showToast._t = setTimeout(() => t.classList.remove('show'), 1600);
            }

            document.getElementById('resetBtn').addEventListener('click', () => {
                const def = CFG[currentIdx];
                const pristine = DEFAULTS.find(d => d.key === def.key);
                if (!pristine) {
                    showToast('NO DEFAULT FOR THIS ITEM');
                    return;
                }
                if (!confirm('Reset "' + def.name + '" to defaults?')) return;
                CFG[currentIdx] = JSON.parse(JSON.stringify(pristine));
                selectedPartIdx = -1;
                buildTabs();
                buildPanel();
                rebuildItemModel();
                saveCfg();
                showToast('ITEM RESET');
            });

            document.getElementById('copyBtn').addEventListener('click', () => {
                const txt = renderConfigJS(false);
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(txt).then(
                        () => showToast('CONFIG COPIED'),
                        () => { console.log(txt); showToast('COPY FAILED — SEE CONSOLE'); }
                    );
                } else {
                    console.log(txt);
                    showToast('COPIED TO CONSOLE');
                }
            });

            /* ---------- SAVE ASSET — download assets/model/itemModels.js ---------- */
            document.getElementById('downloadBtn').addEventListener('click', () => {
                const body = renderConfigJS(true);

                const file =
                    '/* =========================================================================\n' +
                    '   RUIN CITY — item model data\n' +
                    '   -------------------------------------------------------------------------\n' +
                    '   Loaded by index.html (before game.js) and ItemEditor.html.\n' +
                    '   Generated by ItemEditor.html — overwrite assets/model/itemModels.js\n' +
                    '   with this file.\n' +
                    '   ========================================================================= */\n' +
                    body;

                const blob = new Blob([file], { type: 'text/javascript' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'itemModels.js';
                a.click();
                URL.revokeObjectURL(url);
                showToast('SAVED — REPLACE assets/model/itemModels.js');
            });

            /* ---------- LOAD ASSET ---------- */
            document.getElementById('loadBtn').addEventListener('click', () => {
                document.getElementById('loadFile').click();
            });

            document.getElementById('loadFile').addEventListener('change', (e) => {
                const f = e.target.files && e.target.files[0];
                if (!f) return;

                const r = new FileReader();
                r.onload = () => {
                    try {
                        const data = parseAssetFile(r.result);
                        if (!Array.isArray(data) || !data.length) throw new Error('No ITEM_DEFS array found');

                        CFG = normalise(data);
                        currentIdx = 0;
                        selectedPartIdx = -1;
                        buildTabs();
                        buildPanel();
                        rebuildItemModel();
                        saveCfg();
                        showToast('ASSET LOADED');
                    } catch (err) {
                        console.error(err);
                        showToast('LOAD FAILED — SEE CONSOLE');
                    } finally {
                        e.target.value = '';
                    }
                };
                r.readAsText(f);
            });

            /* ---------- Asset file parser ----------
               Accepts two formats:
                 · A generated asset:  window.ITEM_DEFS_DATA = [ ... ];
                 · A raw paste of the in-game const:  const ITEM_DEFS = [ ... ];
               Both are evaluated in an isolated scope, so nothing leaks
               into the page. */
            function parseAssetFile(text) {
                if (/window\.ITEM_DEFS_DATA\s*=/.test(text)) {
                    const fn = new Function('window', text + '; return window.ITEM_DEFS_DATA;');
                    return fn({});
                }

                const start = text.indexOf('[');
                const end = text.lastIndexOf(']');
                if (start < 0 || end <= start) throw new Error('No array literal found');
                return new Function('return (' + text.slice(start, end + 1) + ');')();
            }

            /* ============================================================
               11. EXPORT
               ============================================================ */
            function renderConfigJS(asWindowGlobal) {
                const hex = n => '0x' + (n >>> 0).toString(16).padStart(6, '0');
                const fmt = n => {
                    const s = n.toFixed(4).replace(/0+$/, '').replace(/\.$/, '.0');
                    return s.includes('.') ? s : s + '.0';
                };

                let out = '';
                out += '/* ===== ITEM_DEFS CONFIG — generated by ItemEditor.html ===== */\n';
                out += '/* Drop this into assets/model/itemModels.js, or paste the     */\n';
                out += '/* array straight over the ITEM_DEFS block in game.js.         */\n';
                out += '/*                                                             */\n';
                out += '/* Parts may include:                                          */\n';
                out += '/*   r: [rx, ry, rz]  — rotation in radians (only if non-zero) */\n';
                out += '/*   e: 0xRRGGBB      — emissive/glow colour (only if enabled) */\n';
                out += '/*                                                             */\n';
                out += '/* buildItemMesh() in game.js already honours both, and the    */\n';
                out += '/* inventory thumbnails are generated from the same data.      */\n\n';

                out += (asWindowGlobal ? 'window.ITEM_DEFS_DATA' : 'const ITEM_DEFS') + ' = [\n';

                for (let ii = 0; ii < CFG.length; ii++) {
                    const def = CFG[ii];
                    const comma = ii < CFG.length - 1 ? ',' : '';

                    out += '    {\n';
                    out += '        key: ' + JSON.stringify(def.key) +
                        ', name: ' + JSON.stringify(def.name) + ',\n';
                    out += '        w: ' + (def.w | 0) + ', h: ' + (def.h | 0) +
                        ', color: ' + JSON.stringify(def.color) + ',\n';

                    // NEW — icon-only transform, emitted only when non-default
                    const iR = def.iconR || [0, 0, 0];
                    const iP = def.iconP || [0, 0, 0];
                    const iS = (typeof def.iconScale === 'number') ? def.iconScale : 1;

                    /* NEW — per-orientation overrides, emitted only when set. */
                    if (def.iconPortrait) {
                        const t = def.iconPortrait;
                        out += '        iconPortrait: { r: [' +
                            fmt(t.r[0]) + ', ' + fmt(t.r[1]) + ', ' + fmt(t.r[2]) + '], ' +
                            'p: [' + fmt(t.p[0]) + ', ' + fmt(t.p[1]) + ', ' + fmt(t.p[2]) + '], ' +
                            's: ' + t.s + ' },\n';
                    }
                    if (def.iconLandscape) {
                        const t = def.iconLandscape;
                        out += '        iconLandscape: { r: [' +
                            fmt(t.r[0]) + ', ' + fmt(t.r[1]) + ', ' + fmt(t.r[2]) + '], ' +
                            'p: [' + fmt(t.p[0]) + ', ' + fmt(t.p[1]) + ', ' + fmt(t.p[2]) + '], ' +
                            's: ' + t.s + ' },\n';
                    }

                    if (Math.abs(iR[0]) > 1e-4 || Math.abs(iR[1]) > 1e-4 || Math.abs(iR[2]) > 1e-4) {
                        out += '        iconR: [' +
                            fmt(iR[0]) + ', ' + fmt(iR[1]) + ', ' + fmt(iR[2]) + '],\n';
                    }
                    if (Math.abs(iP[0]) > 1e-4 || Math.abs(iP[1]) > 1e-4 || Math.abs(iP[2]) > 1e-4) {
                        out += '        iconP: [' +
                            fmt(iP[0]) + ', ' + fmt(iP[1]) + ', ' + fmt(iP[2]) + '],\n';
                    }
                    if (Math.abs(iS - 1) > 1e-4) {
                        out += '        iconScale: ' + iS + ',\n';
                    }
                    out += '        model: [\n';

                    for (let pi = 0; pi < def.model.length; pi++) {
                        const b = def.model[pi];
                        const pcomma = pi < def.model.length - 1 ? ',' : '';

                        let line = '            { p: [' +
                            fmt(b.p[0]) + ', ' + fmt(b.p[1]) + ', ' + fmt(b.p[2]) + '], ' +
                            's: [' +
                            fmt(b.s[0]) + ', ' + fmt(b.s[1]) + ', ' + fmt(b.s[2]) + '], ';

                        const r = partRot(b);
                        if (Math.abs(r[0]) > 1e-4 || Math.abs(r[1]) > 1e-4 || Math.abs(r[2]) > 1e-4) {
                            line += 'r: [' +
                                fmt(r[0]) + ', ' + fmt(r[1]) + ', ' + fmt(r[2]) + '], ';
                        }

                        line += 'c: ' + hex(b.c);
                        if (b.e) line += ', e: ' + hex(b.e);
                        line += ' }' + pcomma + '\n';
                        out += line;
                    }

                    out += '        ]\n';
                    out += '    }' + comma + '\n';
                }

                out += '];\n';
                return out;
            }

            /* ============================================================
               12. BUILD + MAIN LOOP
               ============================================================ */
            buildTabs();
            buildPanel();
            rebuildItemModel();
            resize();
            updateLockHint();

            fpCamera.position.set(PM.body.eyeX, PM.body.eyeY, PM.body.eyeZ);

            let lastTime = performance.now();
            function loop(now) {
                requestAnimationFrame(loop);
                const dt = Math.min(0.05, (now - lastTime) / 1000);
                lastTime = now;

                // Idle breathing bob so the hands feel alive
                const t = now * 0.001;
                const breath = Math.sin(t * 1.4) * 0.004;

                fpCamera.position.set(
                    PM.body.eyeX,
                    PM.body.eyeY + breath,
                    PM.body.eyeZ
                );

                if (viewMode === 'fp') {
                    fpCamera.rotation.set(fpPitch, fpYaw, 0);
                    fpRoot.visible = true;
                } else {
                    fpCamera.rotation.set(0, 0, 0);
                    fpRoot.visible = false;
                }

                if (autoSpin) {
                    spinGroup.rotation.y += dt * 1.4;
                } else if (spinGroup.rotation.y !== 0) {
                    // Ease back to the authored orientation
                    spinGroup.rotation.y *= Math.pow(0.001, dt);
                    if (Math.abs(spinGroup.rotation.y) < 1e-3) spinGroup.rotation.y = 0;
                }

                if (viewMode === 'orbit') {
                    updateOrbitCamera();
                    renderer.render(scene, orbitCamera);
                } else {
                    renderer.render(scene, fpCamera);
                }
            }
            requestAnimationFrame(loop);

        })();
    </script>

</body>
